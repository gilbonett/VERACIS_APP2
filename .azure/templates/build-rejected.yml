parameters:
  - name: stageName
    type: string
    default: RetagRejected

  - name: stageDisplayName
    type: string
    default: "🚫 Retag Rejected"

  - name: app
    type: string
    values:
      - api
      - web

  - name: gitTag
    type: string
    # ex: qa-1.0.0 → extrai 1.0.0 e cria rejected-1.0.0

  - name: awsCredentials
    type: string

  - name: awsRegionVar
    type: string

  - name: ecrRegistryVar
    type: string

  - name: ecrRepositoryVar
    type: string

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: "succeeded()"

  - name: variableGroups
    type: object
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: "${{ parameters.condition }}"
    jobs:
      - job: RetagRejected
        displayName: "🚫 Tag Rejected — ${{ parameters.app }}"
        variables:
          - ${{ each g in parameters.variableGroups }}:
              - group: ${{ g }}

        steps:
          - checkout: none

          - script: |
              set -euo pipefail

              GIT_TAG_NAME="${{ parameters.gitTag }}"

              # Extrai versão semântica: qa-1.0.0 → 1.0.0
              VERSION_TAG="$(echo "${GIT_TAG_NAME}" | sed 's/^qa-//')"

              if ! echo "${VERSION_TAG}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "❌ Tag: '${GIT_TAG_NAME}'. Esperado: qa-MAJOR.MINOR.PATCH"
                exit 1
              fi

              REJECTED_TAG="rejected-${VERSION_TAG}"

              echo "##vso[task.setvariable variable=VERSION_TAG]${VERSION_TAG}"
              echo "##vso[task.setvariable variable=REJECTED_TAG]${REJECTED_TAG}"
              echo "✅ Versão: ${VERSION_TAG} → será marcada como: ${REJECTED_TAG}"
            displayName: "🏷️ Resolve version and set rejected tag"

          - task: AWSShellScript@1
            displayName: "🚫 Tag Rejected — ${{ parameters.app }}"
            inputs:
              awsCredentials: "${{ parameters.awsCredentials }}"
              regionName: "${{ parameters.awsRegionVar }}"
              scriptType: "inline"
              inlineScript: |
                set -euo pipefail

                REGISTRY="${{ parameters.ecrRegistryVar }}"
                REPOSITORY="${{ parameters.ecrRepositoryVar }}"
                VERSION_TAG="$(VERSION_TAG)"
                REJECTED_TAG="$(REJECTED_TAG)"
                REGION="${{ parameters.awsRegionVar }}"

                echo "🔍 Verify image ${REPOSITORY}:${VERSION_TAG}..."
                IMAGE_EXISTS=$(aws ecr describe-images \
                  --repository-name "${REPOSITORY}" \
                  --image-ids imageTag="${VERSION_TAG}" \
                  --region "${REGION}" \
                  --query 'imageDetails[0].imageDigest' \
                  --output text 2>/dev/null || echo "NOT_FOUND")

                if [ "${IMAGE_EXISTS}" = "NOT_FOUND" ] || [ "${IMAGE_EXISTS}" = "None" ]; then
                  echo "❌ Image ${REPOSITORY}:${VERSION_TAG} not found in ECR"
                  exit 1
                fi

                echo "✅ Image found: ${IMAGE_EXISTS}"

                MANIFEST=$(aws ecr batch-get-image \
                  --repository-name "${REPOSITORY}" \
                  --image-ids imageTag="${VERSION_TAG}" \
                  --region "${REGION}" \
                  --query 'images[0].imageManifest' \
                  --output text)

                aws ecr put-image \
                  --repository-name "${REPOSITORY}" \
                  --image-tag "${REJECTED_TAG}" \
                  --image-manifest "${MANIFEST}" \
                  --region "${REGION}"

                echo ""
                echo "🚫 Image marked as rejected in ECR:"
                echo "   ${REGISTRY}/${REPOSITORY}:${VERSION_TAG}     (old)"
                echo "   ${REGISTRY}/${REPOSITORY}:${REJECTED_TAG}    (new)"
                echo ""

                echo "📋 Tags for image ${VERSION_TAG}:"
                aws ecr describe-images \
                  --repository-name "${REPOSITORY}" \
                  --image-ids imageTag="${VERSION_TAG}" \
                  --region "${REGION}" \
                  --query 'imageDetails[0].imageTags' \
                  --output table
