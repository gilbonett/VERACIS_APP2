parameters:
  - name: stageName
    type: string
    default: BuildAndPush
  - name: stageDisplayName
    type: string
    default: Build and Push
  - name: jobDisplayName
    type: string
    default: Build and Push - ECR

  - name: app
    type: string
    values:
      - api
      - web

  - name: dockerImageName
    type: string
  - name: dockerfilePath
    type: string
  - name: dockerBuildContext
    type: string
    default: "."
  - name: dockerBuildArgs
    type: string
    default: ""

  - name: awsCredentials
    type: string
  - name: awsRegionVar
    type: string
  - name: ecrRegistryVar
    type: string
  - name: ecrRepositoryVar
    type: string

  # gitTagName: tag que disparou o pipeline (ex: qa-1.0.0)
  - name: gitTagName
    type: string
    default: ""

  # dependsOn: stage anterior para controle de dependência
  - name: dependsOn
    type: string
    default: ""

  # condition: condição para executar o stage (ex: detecção de mudanças)
  - name: condition
    type: string
    default: "succeeded()"

  - name: metadataArtifactName
    type: string
    default: ""

  - name: variableGroups
    type: object
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if ne(parameters.dependsOn, '') }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: BuildAndPush
        displayName: ${{ parameters.jobDisplayName }}
        timeoutInMinutes: 40
        variables:
          - ${{ each g in parameters.variableGroups }}:
              - group: ${{ g }}

        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - script: |
              set -euo pipefail

              SHORT_SHA="$(echo "$(Build.SourceVersion)" | cut -c1-7)"
              BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              GIT_TAG_NAME="${{ parameters.gitTagName }}"

              echo "##vso[task.setvariable variable=IMAGE_TAG_SHA]${SHORT_SHA}"
              echo "##vso[task.setvariable variable=BUILD_DATE]${BUILD_DATE}"

              if [ -n "${GIT_TAG_NAME}" ]; then
                VERSION_TAG="$(echo "${GIT_TAG_NAME}" | sed 's/^qa-//')"

                if ! echo "${VERSION_TAG}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                  echo "❌ Invalid tag: '${GIT_TAG_NAME}'. Esperado: qa-MAJOR.MINOR.PATCH"
                  exit 1
                fi

                echo "##vso[task.setvariable variable=VERSION_TAG]${VERSION_TAG}"
                echo "✅ Tags: sha=${SHORT_SHA} | version=${VERSION_TAG} | latest"
              else
                echo "##vso[task.setvariable variable=VERSION_TAG]"
                echo "✅ Tags: sha=${SHORT_SHA} | latest"
              fi
            displayName: "🏷️ Tags (${{ parameters.app }}: SHA + versão + latest)"

          - script: |
              set -euo pipefail

              docker build \
                -f "${{ parameters.dockerfilePath }}" \
                -t "${{ parameters.dockerImageName }}:$(IMAGE_TAG_SHA)" \
                ${{ parameters.dockerBuildArgs }} \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --label "org.opencontainers.image.ref.name=$(Build.SourceBranchName)" \
                --label "org.opencontainers.image.created=$(BUILD_DATE)" \
                --label "pipeline.build.id=$(Build.BuildId)" \
                --label "veracis.app=${{ parameters.app }}" \
                "${{ parameters.dockerBuildContext }}"

              echo "✅ Docker image built: ${{ parameters.dockerImageName }}:$(IMAGE_TAG_SHA)"
            displayName: "🐳 Build Docker — ${{ parameters.app }}"

          - task: AWSShellScript@1
            displayName: "☁️ Push ECR — ${{ parameters.app }} (sha + tag + latest)"
            inputs:
              awsCredentials: "${{ parameters.awsCredentials }}"
              regionName: "${{ parameters.awsRegionVar }}"
              scriptType: "inline"
              inlineScript: |
                set -euo pipefail

                FULL_IMAGE="${{ parameters.ecrRegistryVar }}/${{ parameters.ecrRepositoryVar }}"
                SHA_TAG="$(IMAGE_TAG_SHA)"
                VERSION_TAG="$(VERSION_TAG)"

                aws ecr get-login-password --region "${{ parameters.awsRegionVar }}" \
                  | docker login --username AWS --password-stdin "${{ parameters.ecrRegistryVar }}"

                # Tag 1: SHA do commit
                docker tag "${{ parameters.dockerImageName }}:${SHA_TAG}" "${FULL_IMAGE}:${SHA_TAG}"
                docker push "${FULL_IMAGE}:${SHA_TAG}"
                echo "✅ ${FULL_IMAGE}:${SHA_TAG}"

                # Tag 2: Versão semântica (só se git tag fornecida)
                if [ -n "${VERSION_TAG}" ]; then
                  docker tag "${{ parameters.dockerImageName }}:${SHA_TAG}" "${FULL_IMAGE}:${VERSION_TAG}"
                  docker push "${FULL_IMAGE}:${VERSION_TAG}"
                  echo "✅ ${FULL_IMAGE}:${VERSION_TAG}"
                fi

                # Tag 3: latest
                docker tag "${{ parameters.dockerImageName }}:${SHA_TAG}" "${FULL_IMAGE}:latest"
                docker push "${FULL_IMAGE}:latest"
                echo "✅ ${FULL_IMAGE}:latest"

                DIGEST="$(aws ecr describe-images \
                  --repository-name "${{ parameters.ecrRepositoryVar }}" \
                  --image-ids imageTag="${SHA_TAG}" \
                  --region "${{ parameters.awsRegionVar }}" \
                  --query 'imageDetails[0].imageDigest' \
                  --output text)"

                echo "##vso[task.setvariable variable=ECR_IMAGE_URI]${FULL_IMAGE}:${SHA_TAG}"
                echo "##vso[task.setvariable variable=IMAGE_DIGEST]${DIGEST}"

                echo ""
                echo "📦 ECR ${{ parameters.app }}:"
                echo "   ${FULL_IMAGE}:${SHA_TAG}"
                [ -n "${VERSION_TAG}" ] && echo "   ${FULL_IMAGE}:${VERSION_TAG}"
                echo "   ${FULL_IMAGE}:latest"

          - script: |
              set -euo pipefail
              META_DIR="$(Build.ArtifactStagingDirectory)/metadata"
              mkdir -p "${META_DIR}"

              VERSION_TAG="$(VERSION_TAG)"
              FULL_IMAGE="${{ parameters.ecrRegistryVar }}/${{ parameters.ecrRepositoryVar }}"

              cat > "${META_DIR}/build-info-${{ parameters.app }}.json" << EOF
              {
                "app":                "${{ parameters.app }}",
                "imageName":          "${{ parameters.dockerImageName }}",
                "imageTag":           "$(IMAGE_TAG_SHA)",
                "imageTagVersion":    "${VERSION_TAG}",
                "imageTagLatest":     "latest",
                "imageDigest":        "$(IMAGE_DIGEST)",
                "commitSha":          "$(Build.SourceVersion)",
                "branch":             "$(Build.SourceBranchName)",
                "gitTag":             "${{ parameters.gitTagName }}",
                "buildId":            "$(Build.BuildId)",
                "buildDate":          "$(BUILD_DATE)",
                "ecrImageUri":        "${FULL_IMAGE}:$(IMAGE_TAG_SHA)",
                "ecrImageUriVersion": "${FULL_IMAGE}:${VERSION_TAG}",
                "ecrImageUriLatest":  "${FULL_IMAGE}:latest"
              }
              EOF

              echo "✅ Metadata ${{ parameters.app }}:"
              cat "${META_DIR}/build-info-${{ parameters.app }}.json"
            displayName: "📄 Write build-info-${{ parameters.app }}.json"

          - task: PublishPipelineArtifact@1
            displayName: "📤 Publish metadata — ${{ parameters.app }}"
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/metadata
              artifact: ${{ coalesce(parameters.metadataArtifactName, format('build-metadata-{0}', parameters.app)) }}
              publishLocation: pipeline
