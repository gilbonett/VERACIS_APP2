# ─────────────────────────────────────────────────────────────────────────────
# deploy-ecs.yml
#
# Faz deploy no ECS de um app específico (API ou Web).
#
# environmentName é OPCIONAL:
#   - Fornecido  → usa deployment job com environment (tracking + gates)
#   - Vazio      → usa job simples sem environment
#
# O artifact é baixado do pipeline ATUAL (source: current).
# A imagem usada no ECS é identificada pela tag semântica (ex: 1.0.0).
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
  - name: stageDisplayName
    type: string
  - name: deploymentName
    type: string
  - name: deploymentDisplayName
    type: string

  # environmentName: opcional
  - name: environmentName
    type: string
    default: ""

  # app: api ou web
  - name: app
    type: string
    values:
      - api
      - web

  - name: metadataArtifactName
    type: string
  - name: ecrRegistryVar
    type: string
  - name: ecrRepositoryVar
    type: string
  - name: ecsClusterVar
    type: string
  - name: ecsServiceVar
    type: string
  - name: ecsTaskFamilyVar
    type: string
  - name: ecsContainerVar
    type: string
  - name: awsCredentials
    type: string
  - name: awsRegionVar
    type: string

  - name: artifactSource
    type: string
    default: current
    values:
      - current
      - specific
      - promote
  - name: ciResourceName
    type: string
    default: ""

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: "succeeded()"

  - name: variableGroups
    type: object
    default: []

  - name: runMigration
    type: boolean
    default: false
  - name: migrationCommand
    type: string
    default: ""

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      # ── Com environment ────────────────────────────────────────────────────
      - ${{ if ne(parameters.environmentName, '') }}:
          - deployment: ${{ parameters.deploymentName }}
            displayName: ${{ parameters.deploymentDisplayName }}
            environment: ${{ parameters.environmentName }}
            timeoutInMinutes: 60
            variables:
              - ${{ each g in parameters.variableGroups }}:
                  - group: ${{ g }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - template: ../steps/deploy-ecs-steps.yml
                      parameters:
                        app: ${{ parameters.app }}
                        metadataArtifactName: ${{ parameters.metadataArtifactName }}
                        ecrRegistryVar: ${{ parameters.ecrRegistryVar }}
                        ecrRepositoryVar: ${{ parameters.ecrRepositoryVar }}
                        ecsClusterVar: ${{ parameters.ecsClusterVar }}
                        ecsServiceVar: ${{ parameters.ecsServiceVar }}
                        ecsTaskFamilyVar: ${{ parameters.ecsTaskFamilyVar }}
                        ecsContainerVar: ${{ parameters.ecsContainerVar }}
                        awsCredentials: ${{ parameters.awsCredentials }}
                        awsRegionVar: ${{ parameters.awsRegionVar }}
                        runMigration: ${{ parameters.runMigration }}
                        migrationCommand: ${{ parameters.migrationCommand }}
                        artifactSource: ${{ parameters.artifactSource }}
                        ciResourceName: ${{ parameters.ciResourceName }}

      # ── Sem environment ────────────────────────────────────────────────────
      - ${{ if eq(parameters.environmentName, '') }}:
          - job: ${{ parameters.deploymentName }}
            displayName: ${{ parameters.deploymentDisplayName }}
            timeoutInMinutes: 60
            variables:
              - ${{ each g in parameters.variableGroups }}:
                  - group: ${{ g }}
            steps:
              - template: ../steps/deploy-ecs-steps.yml
                parameters:
                  app: ${{ parameters.app }}
                  metadataArtifactName: ${{ parameters.metadataArtifactName }}
                  ecrRegistryVar: ${{ parameters.ecrRegistryVar }}
                  ecrRepositoryVar: ${{ parameters.ecrRepositoryVar }}
                  ecsClusterVar: ${{ parameters.ecsClusterVar }}
                  ecsServiceVar: ${{ parameters.ecsServiceVar }}
                  ecsTaskFamilyVar: ${{ parameters.ecsTaskFamilyVar }}
                  ecsContainerVar: ${{ parameters.ecsContainerVar }}
                  awsCredentials: ${{ parameters.awsCredentials }}
                  awsRegionVar: ${{ parameters.awsRegionVar }}
                  runMigration: ${{ parameters.runMigration }}
                  migrationCommand: ${{ parameters.migrationCommand }}
                  artifactSource: ${{ parameters.artifactSource }}
                  ciResourceName: ${{ parameters.ciResourceName }}
