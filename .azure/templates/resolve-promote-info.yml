# ─────────────────────────────────────────────────────────────────────────────
# resolve-promote-info.yml
#
# Lê o .promote-info.json da branch atual e exporta as variáveis
# para os stages seguintes acessarem via stageDependencies.
#
# Variáveis exportadas:
#   GIT_TAG               → ex: qa-1.0.13
#   BUILD_PIPELINE_RUN_ID → ex: 569
#   COMMIT_SHA            → ex: abc123
#
# Como acessar nos stages seguintes:
#   $[ stageDependencies.ResolvePromoteInfo.ReadPromoteInfo.outputs['PromoteInfoStep.GIT_TAG'] ]
#   $[ stageDependencies.ResolvePromoteInfo.ReadPromoteInfo.outputs['PromoteInfoStep.BUILD_PIPELINE_RUN_ID'] ]
#   $[ stageDependencies.ResolvePromoteInfo.ReadPromoteInfo.outputs['PromoteInfoStep.COMMIT_SHA'] ]
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: "succeeded()"

stages:
  - stage: ResolvePromoteInfo
    displayName: "⚙️ Resolve promote-info.json"
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: ReadPromoteInfo
        displayName: "⚙️ Ler promote-info.json"
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -euo pipefail

              PROMOTE_INFO=".promote-info.json"
              [ -f "${PROMOTE_INFO}" ] || { echo "❌ .promote-info.json nao encontrado"; exit 1; }

              GIT_TAG="$(python3 -c "import json; d=json.load(open('${PROMOTE_INFO}')); print(d.get('gitTag', ''))")"
              BUILD_PIPELINE_RUN_ID="$(python3 -c "import json; d=json.load(open('${PROMOTE_INFO}')); print(d.get('buildPipelineRunId', ''))")"
              COMMIT_SHA="$(python3 -c "import json; d=json.load(open('${PROMOTE_INFO}')); print(d.get('commitSha', ''))")"

              [ -z "${GIT_TAG}" ] && { echo "❌ gitTag vazio no promote-info.json"; exit 1; }

              echo "✅ GIT_TAG:               ${GIT_TAG}"
              echo "✅ BUILD_PIPELINE_RUN_ID: ${BUILD_PIPELINE_RUN_ID}"
              echo "✅ COMMIT_SHA:            ${COMMIT_SHA}"

              echo "##vso[task.setvariable variable=GIT_TAG;isOutput=true]${GIT_TAG}"
              echo "##vso[task.setvariable variable=BUILD_PIPELINE_RUN_ID;isOutput=true]${BUILD_PIPELINE_RUN_ID}"
              echo "##vso[task.setvariable variable=COMMIT_SHA;isOutput=true]${COMMIT_SHA}"
            displayName: "⚙️ Exportar variáveis do promote-info.json"
            name: PromoteInfoStep
