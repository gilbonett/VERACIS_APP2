parameters:
  - name: stageName
    type: string
    default: DetectArtifacts
  - name: stageDisplayName
    type: string
    default: "🔍 Detect Artifacts"
  - name: apiArtifactName
    type: string
    default: build-metadata-api
  - name: webArtifactName
    type: string
    default: build-metadata-web
  - name: artifactSource
    type: string
    default: current
    values:
      - current
      - specific
  - name: ciResourceName
    type: string
    default: ""
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: "succeeded()"

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: DetectArtifactsJob
        displayName: "🔍 Verificar quais apps foram buildados"
        steps:
          # ── Download API ───────────────────────────────────────────────────
          - template: ../steps/download-artifact-steps.yml
            parameters:
              artifactName: ${{ parameters.apiArtifactName }}
              downloadPath: $(Pipeline.Workspace)/build-metadata-api
              artifactSource: ${{ parameters.artifactSource }}
              ciResourceName: ${{ parameters.ciResourceName }}

          # ── Download Web ───────────────────────────────────────────────────
          - template: ../steps/download-artifact-steps.yml
            parameters:
              artifactName: ${{ parameters.webArtifactName }}
              downloadPath: $(Pipeline.Workspace)/build-metadata-web
              artifactSource: ${{ parameters.artifactSource }}
              ciResourceName: ${{ parameters.ciResourceName }}

          # ── Verifica e publica variáveis ───────────────────────────────────
          - script: |
              set -euo pipefail

              HAS_API=false
              HAS_WEB=false

              [ -f "$(Pipeline.Workspace)/build-metadata-api/build-info-api.json" ] && HAS_API=true
              [ -f "$(Pipeline.Workspace)/build-metadata-web/build-info-web.json" ] && HAS_WEB=true

              if [ "${HAS_API}" = "true" ] && [ "${HAS_WEB}" = "true" ]; then
                echo "✅ Artifact API found"
                echo "✅ Artifact Web found"
                echo "##vso[task.setvariable variable=HAS_API;isOutput=true]true"
                echo "##vso[task.setvariable variable=HAS_WEB;isOutput=true]true"
                echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]api, web"
              else
                if [ "${HAS_API}" = "true" ]; then
                  echo "✅ Artifact API found"
                  echo "##vso[task.setvariable variable=HAS_API;isOutput=true]true"
                  echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]api"
                else
                  echo "⏭️  Artifact API not found — deploy API will be skipped"
                  echo "##vso[task.setvariable variable=HAS_API;isOutput=true]false"
                fi

                if [ "${HAS_WEB}" = "true" ]; then
                  echo "✅ Artifact Web found"
                  echo "##vso[task.setvariable variable=HAS_WEB;isOutput=true]true"
                  echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]web"
                else
                  echo "⏭️  Artifact Web not found — deploy Web will be skipped"
                  echo "##vso[task.setvariable variable=HAS_WEB;isOutput=true]false"
                fi
              fi

              if [ "${HAS_API}" = "false" ] && [ "${HAS_WEB}" = "false" ]; then
                echo "⚠️  Nothing found — all deploys will be skipped"
                echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]none"
              fi

              echo "📦 API: ${HAS_API} | Web: ${HAS_WEB}"
            displayName: "🔍 Publicar variaveis HAS_API e HAS_WEB"
            name: DetectArtifactsStep
