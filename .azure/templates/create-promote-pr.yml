# ─────────────────────────────────────────────────────────────────────────────
# create-promote-pr.yml
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
    default: CreatePromotePR
  - name: stageDisplayName
    type: string
    default: "🔀 Create Promote PR"

  - name: gitTag
    type: string

  - name: commitSha
    type: string

  - name: targetBranch
    type: string
    default: production

  - name: azureDevOpsOrg
    type: string
  - name: azureDevOpsProject
    type: string
  - name: azureDevOpsPat
    type: string

  - name: reviewers
    type: string
    default: ""

  # buildPipelineRunId: run ID do build-pipeline
  # salvo no promote-info.json para o production-pipeline
  # saber exatamente qual run baixar os artifacts
  - name: buildPipelineRunId
    type: string
    default: ""

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: "succeeded()"

  - name: variableGroups
    type: object
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: CreatePromotePR
        displayName: "🔀 Criar promote/ e abrir PR → production"
        timeoutInMinutes: 15
        variables:
          - ${{ each g in parameters.variableGroups }}:
              - group: ${{ g }}

        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
            fetchTags: true

          # ── Cria branch promote/ + salva promote-info.json ──────────────────
          - script: |
              set -euo pipefail

              GIT_TAG="${{ parameters.gitTag }}"
              COMMIT="${{ parameters.commitSha }}"
              PROMOTE_BRANCH="promote/${GIT_TAG}"
              PAT="${{ parameters.azureDevOpsPat }}"
              ORG_RAW="${{ parameters.azureDevOpsOrg }}"
              PROJECT="${{ parameters.azureDevOpsProject }}"
              REPO_NAME="$(Build.Repository.Name)"

              git config user.email "pipeline@azure-devops.com"
              git config user.name "Azure Pipeline"

              ORG_HOST="$(echo "${ORG_RAW}" | sed 's|https://||')"
              REPO_URL="https://${PAT}@${ORG_HOST}/${PROJECT}/_git/${REPO_NAME}"
              git remote set-url origin "${REPO_URL}"

              if git ls-remote --exit-code --heads origin "${PROMOTE_BRANCH}" > /dev/null 2>&1; then
                echo "Branch ${PROMOTE_BRANCH} ja existe — recriando"
                git push origin --delete "${PROMOTE_BRANCH}" || true
              fi

              git checkout -b "${PROMOTE_BRANCH}" "${COMMIT}"

              # Salva promote-info.json com o run ID do BUILD-pipeline
              # O production-pipeline usa esse ID para baixar os artifacts
              # do build correto — mesmo com múltiplas tags em paralelo
              BUILD_PIPELINE_RUN_ID="${{ parameters.buildPipelineRunId }}"
              [ -z "${BUILD_PIPELINE_RUN_ID}" ] && BUILD_PIPELINE_RUN_ID="$(Build.BuildId)"

              python3 -c "
              import json
              data = {
                'gitTag':               '${GIT_TAG}',
                'commitSha':            '${COMMIT}',
                'buildPipelineRunId':   '${BUILD_PIPELINE_RUN_ID}',
                'testingPipelineRunId': '$(Build.BuildId)',
                'buildDate':            '$(Build.StartTime)'
              }
              print(json.dumps(data, indent=2))
              " > .promote-info.json

              git add .promote-info.json
              git commit -m "chore: promote info for ${GIT_TAG} [skip ci]"
              git push origin "${PROMOTE_BRANCH}"

              echo "##vso[task.setvariable variable=PROMOTE_BRANCH]${PROMOTE_BRANCH}"
              echo "Branch criada: ${PROMOTE_BRANCH} -> ${COMMIT}"
              echo "Build pipeline run ID salvo: ${BUILD_PIPELINE_RUN_ID}"
            displayName: "🌿 Criar branch promote/ + salvar promote-info.json"
            env:
              GIT_PAT: ${{ parameters.azureDevOpsPat }}

          # ── Abre PR via API REST ────────────────────────────────────────────
          - script: |
              set -euo pipefail

              GIT_TAG="${{ parameters.gitTag }}"
              VERSION_TAG="$(echo "${GIT_TAG}" | sed 's/^qa-//')"
              COMMIT="${{ parameters.commitSha }}"
              PROMOTE_BRANCH="promote/${GIT_TAG}"
              TARGET_BRANCH="${{ parameters.targetBranch }}"
              BUILD_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

              ORG="${{ parameters.azureDevOpsOrg }}"
              PROJECT="${{ parameters.azureDevOpsProject }}"
              PAT="${{ parameters.azureDevOpsPat }}"
              REPO_NAME="$(Build.Repository.Name)"

              B64_PAT="$(echo -n ":${PAT}" | base64 -w 0)"

              PR_TITLE="Promote ${GIT_TAG} to production (v${VERSION_TAG})"
              PR_BODY="## Promote ${GIT_TAG} to production\n\n**Tag QA:** ${GIT_TAG}\n**Versao:** ${VERSION_TAG}\n**Commit:** ${COMMIT}\n**Build:** ${BUILD_URL}\n\nCommit validado pelo QA no ambiente AWS.\nAprovando este PR voce autoriza o deploy em producao."

              PAYLOAD="$(python3 -c "
              import json
              data = {
                'title': '${PR_TITLE}',
                'description': '${PR_BODY}',
                'sourceRefName': 'refs/heads/${PROMOTE_BRANCH}',
                'targetRefName': 'refs/heads/${TARGET_BRANCH}'
              }
              print(json.dumps(data))
              ")"

              API_URL="${ORG}/${PROJECT}/_apis/git/repositories/${REPO_NAME}/pullrequests?api-version=7.1"

              RESPONSE="$(curl -s -w "\n%{http_code}" \
                -X POST \
                -H "Authorization: Basic ${B64_PAT}" \
                -H "Content-Type: application/json" \
                -d "${PAYLOAD}" \
                "${API_URL}")"

              HTTP_CODE="$(echo "${RESPONSE}" | tail -1)"
              BODY="$(echo "${RESPONSE}" | head -n -1)"

              if [ "${HTTP_CODE}" = "201" ]; then
                PR_ID="$(echo "${BODY}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('pullRequestId',''))")"
                PR_URL="$(echo "${BODY}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url',''))")"
                echo "PR criado! ID: ${PR_ID} | URL: ${PR_URL}"
                echo "##vso[task.setvariable variable=PR_ID]${PR_ID}"
              else
                echo "Falha ao criar PR (HTTP ${HTTP_CODE})"
                echo "${BODY}"
                exit 1
              fi
            displayName: "🔀 Abrir PR promote/ → production"
            env:
              AZURE_DEVOPS_EXT_PAT: ${{ parameters.azureDevOpsPat }}

          # ── Adiciona reviewers via API REST ─────────────────────────────────
          - script: |
              set -euo pipefail

              REVIEWERS="${{ parameters.reviewers }}"
              [ -z "${REVIEWERS}" ] && echo "Sem reviewers — pulando" && exit 0

              ORG="${{ parameters.azureDevOpsOrg }}"
              PROJECT="${{ parameters.azureDevOpsProject }}"
              PAT="${{ parameters.azureDevOpsPat }}"
              REPO_NAME="$(Build.Repository.Name)"
              PR_ID="$(PR_ID)"

              B64_PAT="$(echo -n ":${PAT}" | base64 -w 0)"

              IFS=',' read -ra REVIEWER_LIST <<< "${REVIEWERS}"
              for REVIEWER in "${REVIEWER_LIST[@]}"; do
                REVIEWER="$(echo "${REVIEWER}" | xargs)"
                [ -z "${REVIEWER}" ] && continue

                USER_URL="${ORG}/_apis/identities?searchFilter=MailAddress&filterValue=${REVIEWER}&api-version=7.1"
                USER_RESP="$(curl -s -H "Authorization: Basic ${B64_PAT}" "${USER_URL}")"

                USER_ID="$(echo "${USER_RESP}" | python3 -c "
              import json, sys
              d = json.load(sys.stdin)
              values = d.get('value', [])
              print(values[0]['id'] if values else '')
              " 2>/dev/null || echo "")"

                if [ -z "${USER_ID}" ]; then
                  echo "Reviewer nao encontrado: ${REVIEWER}"
                  continue
                fi

                ADD_URL="${ORG}/${PROJECT}/_apis/git/repositories/${REPO_NAME}/pullrequests/${PR_ID}/reviewers/${USER_ID}?api-version=7.1"
                ADD_RESP="$(curl -s -w "\n%{http_code}" \
                  -X PUT \
                  -H "Authorization: Basic ${B64_PAT}" \
                  -H "Content-Type: application/json" \
                  -d "{\"vote\": 0}" \
                  "${ADD_URL}")"

                HTTP_CODE="$(echo "${ADD_RESP}" | tail -1)"
                [ "${HTTP_CODE}" = "200" ] \
                  && echo "Reviewer adicionado: ${REVIEWER}" \
                  || echo "Falha ao adicionar reviewer ${REVIEWER} (HTTP ${HTTP_CODE})"
              done
            displayName: "👥 Adicionar reviewers ao PR"
            condition: and(succeeded(), ne('${{ parameters.reviewers }}', ''))
            env:
              AZURE_DEVOPS_EXT_PAT: ${{ parameters.azureDevOpsPat }}
