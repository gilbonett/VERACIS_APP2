parameters:
  - name: stageName
    type: string
    default: Notify

  - name: stageDisplayName
    type: string
    default: "🔔 Notify"

  - name: gitTag
    type: string
    default: "no exists"

  - name: webhookUrl
    type: string

  - name: status
    type: string
    values:
      - waiting-approval
      - prod-waiting-approval
      - build-waiting-approval
      - testing-waiting-approval
      - build-success
      - testing-started
      - testing-success
      - prod-started
      - prod-success
      - rejected-tag
      - failure
  - name: environmentName
    type: string
    default: "-"
  - name: changedApps
    type: string
    default: "No apps changed"
  - name: mentions
    type: string
    default: ""
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: "always()"
  - name: variableGroups
    type: object
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: "${{ parameters.condition }}"
    jobs:
      - job: NotifyJob
        displayName: "🔔 Send notification in Teams"
        continueOnError: true
        timeoutInMinutes: 5
        variables:
          - ${{ each g in parameters.variableGroups }}:
              - group: ${{ g }}

          - name: RESOLVED_GIT_TAG
            value: ${{ parameters.gitTag }}

          - name: RESOLVED_CHANGED_APPS
            value: ${{ parameters.changedApps }}

        steps:
          - script: |
              set -euo pipefail

              GIT_TAG_PARAM="$(RESOLVED_GIT_TAG)"
              GIT_TAG="${GIT_TAG_PARAM#refs/tags/}"
              GIT_TAG="${GIT_TAG}"

              STATUS="${{ parameters.status }}"
              ENV="${{ parameters.environmentName }}"
              CHANGED_APPS="$(RESOLVED_CHANGED_APPS)"
              MENTIONS="${{ parameters.mentions }}"

              echo "STATUS: ${STATUS}"
              echo "ENV: ${ENV}"
              echo "CHANGED_APPS: ${CHANGED_APPS}"
              echo "MENTIONS: ${MENTIONS}"
              echo "GIT_TAG: ${GIT_TAG}"

              case "${STATUS}" in
                waiting-approval)
                  COLOR="Warning"
                  EMOJI="⏳"
                  TITLE="Waiting Approval"
                  DESCRIPTION="The pipeline is awaiting approval to continue. Check that the environment is available and go ahead and start the deployment."
                  ;;
                prod-waiting-approval)
                  COLOR="Warning"
                  EMOJI="⏳"
                  TITLE="Waiting Approval (Production)"
                  DESCRIPTION="The production deployment pipeline is awaiting approval to continue."
                  ;;
                testing-waiting-approval)
                  COLOR="Warning"
                  EMOJI="⏳"
                  TITLE="Waiting Approval (Testing)"
                  DESCRIPTION="The testing deployment pipeline is awaiting approval to continue."
                  ;;
                build-waiting-approval)
                  COLOR="Warning"
                  EMOJI="⏳"
                  TITLE="Waiting Approval (Build)"
                  DESCRIPTION="The build pipeline is awaiting approval to continue. A new version has been created and is awaiting approval."
                  ;;
                build-success)
                  COLOR="Good"
                  EMOJI="🏗️"
                  TITLE="Success (Build)"
                  DESCRIPTION="The Docker images have been built and published to ECR. Deployment to the testing environment will begin shortly."
                  ;;
                testing-started)
                  COLOR="Accent"
                  EMOJI="🚀"
                  TITLE="Started (Testing)"
                  DESCRIPTION="The deployment process to the testing environment has begun and is currently in progress. Check the pipeline for more details."
                  ;;
                testing-success)
                  COLOR="Good"
                  EMOJI="🧪"
                  TITLE="Deploy Success (Testing)"
                  DESCRIPTION="The deployment to the testing environment was successful. The environment is ready for QA validation."
                  ;;
                prod-started)
                  COLOR="Accent"
                  EMOJI="🚀"
                  TITLE="Started (Production)"
                  DESCRIPTION="The production deployment process has been approved and is currently underway. Check the pipeline for more details."
                  ;;
                prod-success)
                  COLOR="Good"
                  EMOJI="✅"
                  TITLE="Deploy Success (Production)"
                  DESCRIPTION="The deployment to production was successful. The version is now available to users."
                  ;;
                rejected-tag)
                  COLOR="Attention"
                  EMOJI="❌"
                  TITLE="Tag Version Rejected"
                  DESCRIPTION="The tag version was rejected. The implementation failed the test validations.."
                  ;;
                failure)
                  COLOR="Attention"
                  EMOJI="❌"
                  TITLE="Deploy Failure"
                  DESCRIPTION="An error occurred during the pipeline. Click the link below to view the logs and identify the issue."
                  ;;
                *)
                  COLOR="Default"
                  EMOJI="ℹ️"
                  TITLE="Notificação"
                  DESCRIPTION=""
                  ;;
              esac

              MENTION_ENTITIES="[]"
              MENTION_TEXT=""

              if [ -n "${MENTIONS}" ]; then
                ENTITIES=""
                TEXT=""

                IFS=';' read -ra ENTRIES <<< "${MENTIONS}"
                for ENTRY in "${ENTRIES[@]}"; do
                  ENTRY="$(echo "${ENTRY}" | xargs)"
                  [ -z "${ENTRY}" ] && continue

                  NAME="$(echo "${ENTRY}" | cut -d':' -f1 | xargs)"
                  EMAIL="$(echo "${ENTRY}" | cut -d':' -f2- | xargs)"
                  [ -z "${NAME}" ] || [ -z "${EMAIL}" ] && continue

                  MRI="${EMAIL}"
                  [ -n "${ENTITIES}" ] && ENTITIES="${ENTITIES},"
                  ENTITIES="${ENTITIES}{\"type\":\"mention\",\"text\":\"<at>${NAME}</at>\",\"mentioned\":{\"id\":\"${MRI}\",\"name\":\"${NAME}\"}}"
                  [ -n "${TEXT}" ] && TEXT="${TEXT} "
                  TEXT="${TEXT}<at>${NAME}</at>"
                done

                [ -n "${ENTITIES}" ] && MENTION_ENTITIES="[${ENTITIES}]"
                MENTION_TEXT="${TEXT}"
              fi

              MENTION_LINE=""
              if [ -n "${MENTION_TEXT}" ]; then
                case "${STATUS}" in
                  waiting-approval)       MENTION_LINE="${MENTION_TEXT} — Approval required to continue the deployment. ⏳" ;;
                  build-waiting-approval) MENTION_LINE="${MENTION_TEXT} — Waiting for approval to continue the build. ⏳" ;;
                  testing-waiting-approval) MENTION_LINE="${MENTION_TEXT} — Waiting approval for deployment to the testing environment. ⏳" ;;
                  prod-waiting-approval)  MENTION_LINE="${MENTION_TEXT} — Waiting approval for deployment to production. ⏳" ;;
                  build-success)          MENTION_LINE="${MENTION_TEXT} — Build complete, deploying to testing. 🏗️" ;;
                  testing-started)        MENTION_LINE="${MENTION_TEXT} — Deployment to testing has begun. 🚀"                 ;;
                  testing-success)        MENTION_LINE="${MENTION_TEXT} — Testing environment ready for validation. 🧪"   ;;
                  prod-started)           MENTION_LINE="${MENTION_TEXT} — Deployment to production has begun. 🚀"                 ;;
                  prod-success)           MENTION_LINE="${MENTION_TEXT} — Deployment to production has completed successfully! ✅"    ;;
                  rejected-tag)           MENTION_LINE="${MENTION_TEXT} — The tag version was rejected. The implementation failed the test validations. ❌" ;;
                  failure)                MENTION_LINE="${MENTION_TEXT} — The pipeline failed, check the logs! ❌"        ;;
                  *)                      MENTION_LINE="${MENTION_TEXT}"                                                    ;;
                esac
              fi

              PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"

              MENTION_BLOCK=""
              if [ -n "${MENTION_LINE}" ]; then
                MENTION_BLOCK=",{\"type\":\"TextBlock\",\"text\":\"${MENTION_LINE}\",\"wrap\":true,\"spacing\":\"Medium\",\"size\":\"Medium\"}"
              fi

              DESCRIPTION_BLOCK=""
              if [ -n "${DESCRIPTION}" ]; then
                DESCRIPTION_BLOCK=",{\"type\":\"TextBlock\",\"text\":\"${DESCRIPTION}\",\"wrap\":true,\"spacing\":\"Small\",\"isSubtle\":true}"
              fi

              FACTS=""
              [ -n "${GIT_TAG}" ] && FACTS="${FACTS}{\"title\":\"Tag\",\"value\":\"${GIT_TAG}\"},"
              [ -n "${ENV}" ] && FACTS="${FACTS}{\"title\":\"Ambiente\",\"value\":\"${ENV}\"},"
              [ -n "${CHANGED_APPS}" ] && FACTS="${FACTS}{\"title\":\"Apps\",\"value\":\"${CHANGED_APPS}\"},"
              FACTS="${FACTS}{\"title\":\"Build\",\"value\":\"$(Build.BuildId)\"},"
              FACTS="${FACTS}{\"title\":\"Commit\",\"value\":\"$(Build.SourceVersion)\"},"
              FACTS="${FACTS}{\"title\":\"Branch\",\"value\":\"$(Build.SourceBranchName)\"},"
              FACTS="${FACTS}{\"title\":\"Solicitado por\",\"value\":\"$(Build.RequestedFor)\"}"

              PAYLOAD="$(cat << EOF
              {
                "type": "message",
                "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "msteams": {
                      "entities": ${MENTION_ENTITIES}
                    },
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "${EMOJI} ${TITLE}",
                        "weight": "Bolder",
                        "size": "Large",
                        "color": "${COLOR}"
                      }
                      ${DESCRIPTION_BLOCK}
                      ,{
                        "type": "FactSet",
                        "facts": [${FACTS}]
                      }
                      ${MENTION_BLOCK}
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "🔍 Ver Pipeline",
                        "url": "${PIPELINE_URL}"
                      }
                    ]
                  }
                }]
              }
              EOF
              )"

              HTTP_STATUS="$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Content-Type: application/json" \
                -d "${PAYLOAD}" \
                "${{ parameters.webhookUrl }}")"

              [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "202" ] \
                && echo "✅ Teams notificated (HTTP ${HTTP_STATUS})" \
                || echo "⚠️  Teams returned HTTP ${HTTP_STATUS} — continuing"
            displayName: "📨 Notifify Teams"
            continueOnError: true
