# ─────────────────────────────────────────────────────────────────────────────
# approval-gate.yml
#
# Stage genérico de Approval Gate usando Azure DevOps Environments.
# O pipeline PAUSA aqui até o aprovador confirmar no Azure DevOps.
#
# Configurar o Environment em:
# Pipelines > Environments > {environmentName} > Approvals and checks
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
    default: ApprovalGate

  - name: stageDisplayName
    type: string
    default: "⏳ Approval Gate"

  - name: environmentName
    type: string
    default: testing

  - name: deploymentName
    type: string
    default: WaitForApproval

  - name: deploymentDisplayName
    type: string
    default: "⏳ Waiting for approval"

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: "succeeded()"

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: "${{ parameters.condition }}"
    jobs:
      - deployment: ${{ parameters.deploymentName }}
        displayName: ${{ parameters.deploymentDisplayName }}
        environment: ${{ parameters.environmentName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "✅ Gate approved — "
                    echo "   Environment: ${{ parameters.environmentName }}"
                    echo "   Commit:      $(Build.SourceVersion)"
                    echo "   Branch:      $(Build.SourceBranchName)"
                    echo "   Build:       $(Build.BuildId)"
                  displayName: "✅ Approved confirmed"
