# ─────────────────────────────────────────────────────────────────────────────
# detect-changes-tag.yml
#
# Valida o formato da tag (qa-MAJOR.MINOR.PATCH ou vMAJOR.MINOR.PATCH) e
# verifica o que mudou em apps/api e apps/web comparando a tag atual com a
# última tag v* (versão de produção) anterior a ela — a própria tag atual
# é excluída da busca, caso ela também seja uma tag v*.
#
# Ex: qa-4.0.0 → busca última v* antes dela (ex: v3.0.0) e compara os dois commits
# Ex: v4.0.0   → busca última v* anterior a ela (ex: v3.0.0) e compara os dois commits
#
# Sem nenhuma tag v* anterior → considera tudo mudado (primeiro deploy)
#
# Publica: CHANGED_API, CHANGED_WEB, VERSION_TAG, MAJOR, MINOR, PATCH
# Nunca falha por ausência de mudanças — apenas seta false.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
    default: DetectChanges

  - name: stageDisplayName
    type: string
    default: "🔍 Detect Changes"

  - name: gitTag
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: "succeeded()"

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: DetectChangesJob
        displayName: "🔍 Detect Changes in Tag"
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          # ── 1. Valida a tag e exporta metadados ────────────────────────────
          - bash: |
              set -euo pipefail

              GIT_TAG="${{ parameters.gitTag }}"
              echo "Tag: ${GIT_TAG}"

              if ! echo "${GIT_TAG}" | grep -qE '^(qa-|v)[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "❌ Invalid Tag: '${GIT_TAG}'"
                echo "Expected format: qa-MAJOR.MINOR.PATCH (ex: qa-1.0.0) or vMAJOR.MINOR.PATCH (ex: v1.2.3)"
                exit 1
              fi

              VERSION_TAG="$(echo "${GIT_TAG}" | sed -E 's/^(qa-|v)//')"
              MAJOR="$(echo "${VERSION_TAG}" | cut -d'.' -f1)"
              MINOR="$(echo "${VERSION_TAG}" | cut -d'.' -f2)"
              PATCH="$(echo "${VERSION_TAG}" | cut -d'.' -f3)"

              echo "##vso[task.setvariable variable=GIT_TAG_RESOLVED]${GIT_TAG}"
              echo "##vso[task.setvariable variable=VERSION_TAG;isOutput=true]${VERSION_TAG}"
              echo "##vso[task.setvariable variable=MAJOR;isOutput=true]${MAJOR}"
              echo "##vso[task.setvariable variable=MINOR;isOutput=true]${MINOR}"
              echo "##vso[task.setvariable variable=PATCH;isOutput=true]${PATCH}"

              echo "✅ Tag: ${GIT_TAG} → versão ${VERSION_TAG}"
            displayName: "🏷️ Validate qa-MAJOR.MINOR.PATCH Tag"
            name: ValidateTag
            workingDirectory: $(Build.SourcesDirectory)

          # ── 2. Compara com a última tag v* anterior à tag atual ────────────
          - bash: |
              set -euo pipefail

              GIT_TAG="$(GIT_TAG_RESOLVED)"

              echo "==================================="
              echo "🔍 Detecting changes for tag: ${GIT_TAG}"
              echo "==================================="

              # Pega o commit EXATO da tag atual
              TAG_COMMIT="$(git rev-list -n 1 "${GIT_TAG}")"
              TAG_COMMIT_DATE="$(git log -1 --format=%ct "${TAG_COMMIT}")"
              echo "📦 Tag commit: ${TAG_COMMIT}"

              # Busca a última tag versionada (v*) com data anterior à tag atual
              PREV_TAG=""
              while IFS= read -r TAG; do
                [ "${TAG}" = "${GIT_TAG}" ] && continue
                CANDIDATE_COMMIT="$(git rev-list -n 1 "${TAG}" 2>/dev/null || continue)"
                CANDIDATE_DATE="$(git log -1 --format=%ct "${CANDIDATE_COMMIT}")"
                if [ "${CANDIDATE_DATE}" -le "${TAG_COMMIT_DATE}" ]; then
                  PREV_TAG="${TAG}"
                  break
                fi
              done < <(git tag -l --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

              if [ -z "${PREV_TAG}" ]; then
                echo "⚠️  No previous v* tag found — marking everything as changed (first deploy)"
                echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]true"
                echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]true"
                echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]api, web"
                exit 0
              fi

              PREV_COMMIT="$(git rev-list -n 1 "${PREV_TAG}")"
              echo "📦 Previous tag:    ${PREV_TAG}"
              echo "📦 Previous commit: ${PREV_COMMIT}"
              echo "📦 Comparing:       ${PREV_TAG} → ${GIT_TAG}"

              CHANGED_FILES="$(git diff "${PREV_COMMIT}..${TAG_COMMIT}" --name-only || true)"

              echo "Changed files:"
              echo "${CHANGED_FILES}"
              echo ""

              # Arquivos compartilhados forçam rebuild de tudo
              SHARED_CHANGED=false
              for PATTERN in pnpm-lock.yaml pnpm-workspace.yaml package.json turbo.json; do
                if echo "${CHANGED_FILES}" | grep -q "^${PATTERN}$"; then
                  echo "⚠️  Shared files: ${PATTERN} → rebuild API + Web"
                  SHARED_CHANGED=true
                  break
                fi
              done

              if [ "${SHARED_CHANGED}" = "true" ]; then
                echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]true"
                echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]true"
                echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]api, web"
                echo "✅ API: true | Web: true (shared files)"
              else
                if echo "${CHANGED_FILES}" | grep -qE '^apps/api/'; then
                  echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]true"
                  echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]api"
                  echo "✅ API changed"
                else
                  echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]false"
                  echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]none"
                  echo "⏭️  API unchanged"
                fi

                if echo "${CHANGED_FILES}" | grep -qE '^apps/web/'; then
                  echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]true"
                  echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]web"
                  echo "✅ Web changed"
                else
                  echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]false"
                  echo "##vso[task.setvariable variable=CHANGED_APPS;isOutput=true]none"
                  echo "⏭️  Web unchanged"
                fi
              fi

            displayName: "🔎 Detect changes in apps/api and apps/web"
            name: DetectChangesStep
            workingDirectory: $(Build.SourcesDirectory)
