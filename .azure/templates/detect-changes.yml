# ─────────────────────────────────────────────────────────────────────────────
# detect-changes.yml
#
# Detecta quais apps do Turborepo sofreram mudanças.
# Publica CHANGED_API e CHANGED_WEB para controlar os stages seguintes.
#
# detectType:
#   - branch → compara HEAD~1 com HEAD (último commit da branch)
#   - tag    → compara a tag atual com a tag anterior do mesmo prefixo
#              ex: qa-1.0.1 vs qa-1.0.0 | v1.0.1 vs v1.0.0
#
# Nunca falha por ausência de mudanças — apenas seta false.
# Arquivos compartilhados (pnpm-lock, turbo.json) forçam rebuild de tudo.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
    default: DetectChanges

  - name: stageDisplayName
    type: string
    default: "🔍 Detect Changes"

  # detectType: branch | tag
  - name: detectType
    type: string
    default: branch
    values:
      - branch
      - tag

  - name: branch
    type: string
    default: ""

  - name: tag
    type: string
    default: ""

  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: "succeeded()"

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: DetectChanges
        displayName: "🔍 Detect changes (API / Web)"
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - ${{ if eq(parameters.detectType, 'tag') }}:
              - bash: |
                  set -euo pipefail

                  GIT_TAG="${{ parameters.tag }}"
                  [ -z "${GIT_TAG}" ] && GIT_TAG="${GIT_TAG:-}"
                  [ -z "${GIT_TAG}" ] && GIT_TAG="${RESOURCES_PIPELINE_BUILDPIPELINE_SOURCEBRANCH:-}"
                  GIT_TAG="${GIT_TAG#refs/tags/}"
                  [ -z "${GIT_TAG}" ] && GIT_TAG="$(Build.SourceBranchName)"

                  echo "Tag recebida: ${GIT_TAG}"

                  if ! echo "${GIT_TAG}" | grep -qE '^qa-[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "❌ Tag invalida: '${GIT_TAG}'"
                    echo "   Formato esperado: qa-MAJOR.MINOR.PATCH (ex: qa-1.0.0)"
                    exit 1
                  fi

                  VERSION_TAG="$(echo "${GIT_TAG}" | sed 's/^qa-//')"
                  MAJOR="$(echo "${VERSION_TAG}" | cut -d'.' -f1)"
                  MINOR="$(echo "${VERSION_TAG}" | cut -d'.' -f2)"
                  PATCH="$(echo "${VERSION_TAG}" | cut -d'.' -f3)"

                  echo "##vso[task.setvariable variable=VERSION_TAG;isOutput=true]${VERSION_TAG}"
                  echo "##vso[task.setvariable variable=GIT_TAG_RESOLVED;isOutput=true]${GIT_TAG}"
                  echo "##vso[task.setvariable variable=MAJOR;isOutput=true]${MAJOR}"
                  echo "##vso[task.setvariable variable=MINOR;isOutput=true]${MINOR}"
                  echo "##vso[task.setvariable variable=PATCH;isOutput=true]${PATCH}"

                  echo "✅ Tag valida: ${GIT_TAG} → versão ${VERSION_TAG}"
                displayName: "🏷️ Validar tag qa-MAJOR.MINOR.PATCH"
                name: ValidateTag
                workingDirectory: $(Build.SourcesDirectory)

          # ── Detecta mudanças ───────────────────────────────────────────────
          - bash: |
              set -euo pipefail

              DETECT_TYPE="${{ parameters.detectType }}"

              echo "==================================="
              echo "🔍 Detectando mudanças (modo: ${DETECT_TYPE})..."
              echo "==================================="

              if [ "${DETECT_TYPE}" = "tag" ]; then
                # ── Modo TAG: compara tag atual com tag anterior ─────────────
                GIT_TAG="${{ parameters.tag }}"
                [ -z "${GIT_TAG}" ] && GIT_TAG="${GIT_TAG:-}"
                [ -z "${GIT_TAG}" ] && GIT_TAG="${RESOURCES_PIPELINE_BUILDPIPELINE_SOURCEBRANCH:-}"
                GIT_TAG="${GIT_TAG#refs/tags/}"
                [ -z "${GIT_TAG}" ] && GIT_TAG="$(Build.SourceBranchName)"

                # Extrai o prefixo da tag (ex: qa- de qa-1.0.1)
                TAG_PREFIX="$(echo "${GIT_TAG}" | grep -oE '^[a-z]+-' || echo '')"

                # Pega a tag anterior do mesmo prefixo
                PREV_TAG="$(git tag -l "${TAG_PREFIX}*" --sort=-version:refname \
                  | grep -v "^${GIT_TAG}$" \
                  | head -1 || echo '')"

                if [ -z "${PREV_TAG}" ]; then
                  echo "⚠️  Sem tag anterior com prefixo '${TAG_PREFIX}' — detectando tudo como mudado"
                  echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]true"
                  echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]true"
                  exit 0
                fi

                echo "📦 Comparando: ${PREV_TAG} → ${GIT_TAG}"
                CHANGED_FILES="$(git diff "${PREV_TAG}..${GIT_TAG}" --name-only || true)"

              else
                # ── Modo BRANCH: compara HEAD~1 com HEAD ─────────────────────
                echo "📦 Comparando: HEAD~1 → HEAD"
                CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD || true)"
              fi

              echo "Arquivos modificados:"
              echo "${CHANGED_FILES}"
              echo ""

              # ── Arquivos compartilhados forçam rebuild de tudo ────────────
              SHARED_CHANGED=false
              for PATTERN in pnpm-lock.yaml pnpm-workspace.yaml package.json turbo.json; do
                if echo "${CHANGED_FILES}" | grep -q "^${PATTERN}$"; then
                  echo "⚠️  Arquivo compartilhado modificado: ${PATTERN} → rebuild de API + Web"
                  SHARED_CHANGED=true
                  break
                fi
              done

              if [ "${SHARED_CHANGED}" = "true" ]; then
                echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]true"
                echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]true"
                echo "✅ API: true (arquivo compartilhado)"
                echo "✅ Web: true (arquivo compartilhado)"
              else
                if echo "${CHANGED_FILES}" | grep -qE '^apps/api/'; then
                  echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]true"
                  echo "✅ API changed - will build"
                else
                  echo "##vso[task.setvariable variable=CHANGED_API;isOutput=true]false"
                  echo "⏭️  API unchanged - skipping"
                fi

                if echo "${CHANGED_FILES}" | grep -qE '^apps/web/'; then
                  echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]true"
                  echo "✅ Web changed - will build"
                else
                  echo "##vso[task.setvariable variable=CHANGED_WEB;isOutput=true]false"
                  echo "⏭️  Web unchanged - skipping"
                fi
              fi

              echo "==================================="
            displayName: "🔎 Detectar mudanças em apps/api e apps/web"
            name: changes
            workingDirectory: $(Build.SourcesDirectory)
