# ─────────────────────────────────────────────────────────────────────────────
# approved-tag.yml
#
# Converte uma tag de teste em tag de release no mesmo commit exato.
# Sempre deleta a tag de origem após criar a nova.
#
# Ex: qa-1.0.0 criada no commit A1
#   → cria v1.0.0 no commit A1
#   → deleta qa-1.0.0
#     mesmo que já existam commits A2, A3... mais recentes na branch.
#
# Autenticação: usa o token nativo do Build Service via persistCredentials.
# Requisitos de permissão (no repositório, para o Build Service):
#   - Contribute
#   - Create tag
#   - Force push (rewrite history, delete branches and tags)
#
# Exporta:
#   RELEASE_TAG    → ex: v1.0.0
#   RELEASE_COMMIT → ex: abc123
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
    default: ApprovedTag
  - name: stageDisplayName
    type: string
    default: "🏷️ Approved Retag"

  # sourceTag: tag de teste a ser convertida (ex: qa-1.0.0)
  # A tag de release é calculada automaticamente: qa-1.0.0 → v1.0.0
  - name: sourceTag
    type: string

  # changedApps: apps que foram alterados (ex: api, web)
  - name: changedApps
    type: string
    default: "-"

  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: "succeeded()"
  - name: variableGroups
    type: object
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: "${{ parameters.condition }}"
    jobs:
      - job: ApprovedTagJob
        displayName: "🏷️ Retag Job"
        timeoutInMinutes: 10
        variables:
          - ${{ each g in parameters.variableGroups }}:
              - group: ${{ g }}

          - name: RESOLVED_CHANGED_APPS
            value: ${{ parameters.changedApps }}

        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
            fetchTags: true

          - script: |
              set -euo pipefail

              SOURCE_TAG="${{ parameters.sourceTag }}"
              SOURCE_TAG="${SOURCE_TAG#refs/tags/}"
              CHANGED_APPS="$(RESOLVED_CHANGED_APPS)"

              # Identidade do commit/tag (não usado para autenticar — só metadado)
              git config user.email "pipeline@azure-devops.com"
              git config user.name "Azure Pipeline"

              # qa-1.0.0 → v1.0.0
              VERSION="${SOURCE_TAG#qa-}"
              TARGET_TAG="v${VERSION}"

              echo "📦 Source tag:   ${SOURCE_TAG}"
              echo "📦 Target tag:   ${TARGET_TAG}"
              echo "📦 Changed apps: ${CHANGED_APPS}"
              echo "🔐 Auth:         Build Service token (persistCredentials)"

              # Garante que a tag de origem existe no remoto
              if ! git ls-remote --exit-code --tags origin "${SOURCE_TAG}" > /dev/null 2>&1; then
                echo "❌ Source tag not found on remote: ${SOURCE_TAG}"
                exit 1
              fi

              # Resolve o commit apontado pela tag de origem
              # Tenta local primeiro; se não tiver, busca do remoto
              if ! COMMIT="$(git rev-list -n 1 "${SOURCE_TAG}" 2>/dev/null)"; then
                git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
                COMMIT="$(git rev-list -n 1 "${SOURCE_TAG}")"
              fi
              echo "📦 Commit: ${COMMIT}"

              TAG_MESSAGE="Released v${VERSION} | apps: ${CHANGED_APPS} | build: $(Build.BuildId) | commit: ${COMMIT}"

              # ── Cria a tag de release (idempotente) ──────────────────────────
              if git ls-remote --exit-code --tags origin "${TARGET_TAG}" > /dev/null 2>&1; then
                EXISTING_COMMIT="$(git ls-remote --tags origin "${TARGET_TAG}" | awk '{print $1}')"
                # Tags anotadas: o SHA do ls-remote é o do objeto-tag, não do commit.
                # Resolve o commit real fazendo fetch + rev-list.
                git fetch origin "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}" 2>/dev/null || true
                EXISTING_COMMIT_RESOLVED="$(git rev-list -n 1 "${TARGET_TAG}" 2>/dev/null || echo "${EXISTING_COMMIT}")"

                if [ "${EXISTING_COMMIT_RESOLVED}" = "${COMMIT}" ]; then
                  echo "⚠️  Tag ${TARGET_TAG} already exists on the same commit — skipping creation"
                else
                  echo "❌ Tag ${TARGET_TAG} already exists on a different commit (${EXISTING_COMMIT_RESOLVED})"
                  echo "    Expected: ${COMMIT}"
                  echo "    Refusing to overwrite — please investigate manually."
                  exit 1
                fi
              else
                git tag -a "${TARGET_TAG}" "${COMMIT}" -m "${TAG_MESSAGE}"
                if ! git push origin "${TARGET_TAG}"; then
                  echo "❌ Failed to push tag ${TARGET_TAG}"
                  echo "    Check that the Build Service has 'Create tag' permission on this repo."
                  exit 1
                fi
                echo "✅ Tag ${TARGET_TAG} created @ ${COMMIT}"
              fi

              # ── Deleta a tag de origem (remote + local) ──────────────────────
              if ! git push origin --delete "${SOURCE_TAG}"; then
                echo "❌ Failed to delete remote tag ${SOURCE_TAG}"
                echo "    The Build Service needs 'Force push' permission to delete tags"
                echo "    created by other users. Go to:"
                echo "      Project Settings → Repos → ${BUILD_REPOSITORY_NAME:-this repo} → Security"
                echo "    and grant 'Force push' to the Build Service identity."
                exit 1
              fi
              git tag -d "${SOURCE_TAG}" 2>/dev/null || true
              echo "🗑️  Tag ${SOURCE_TAG} deleted (remote + local)"

              echo ""
              echo "✅ Retag complete: ${SOURCE_TAG} → ${TARGET_TAG} @ ${COMMIT}"
              echo "📝 Message: ${TAG_MESSAGE}"

              echo "##vso[task.setvariable variable=RELEASE_TAG;isOutput=true]${TARGET_TAG}"
              echo "##vso[task.setvariable variable=RELEASE_COMMIT;isOutput=true]${COMMIT}"
            displayName: "🏷️ Create tag release"
            name: ApprovedTagStep
