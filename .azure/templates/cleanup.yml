# ─────────────────────────────────────────────────────────────────────────────
# cleanup.yml
#
# Executado após o merge do PR promote/ → production.
# Cria a tag semântica v1.0.0 no repositório e deleta a branch promote/.
# Idempotente — não falha se branch já foi deletada.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: stageName
    type: string
    default: Cleanup
  - name: stageDisplayName
    type: string
    default: "🧹 Tag Release + Cleanup"

  - name: gitTagName
    type: string # ex: qa-1.0.0
  - name: commitSha
    type: string

  - name: createSemanticTag
    type: boolean
    default: true

  - name: azureDevOpsOrg
    type: string
  - name: azureDevOpsProject
    type: string
  - name: azureDevOpsPat
    type: string

  - name: dependsOn
    type: object
    default: []

  - name: variableGroups
    type: object
    default: []

  - name: condition
    type: string
    default: succeeded()

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.stageDisplayName }}
    ${{ if gt(length(parameters.dependsOn), 0) }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    jobs:
      - job: CleanupJob
        displayName: "🧹 Criar tag de release e limpar branches"
        timeoutInMinutes: 15
        variables:
          - ${{ each g in parameters.variableGroups }}:
              - group: ${{ g }}

        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
            fetchTags: true

          # ── Cria tag semântica v1.0.0 ────────────────────────────────────────
          - script: |
              set -euo pipefail

              GIT_TAG="${{ parameters.gitTagName }}"
              COMMIT="${{ parameters.commitSha }}"
              VERSION_TAG="$(echo "${GIT_TAG}" | sed 's/^qa-//')"
              RELEASE_TAG="v${VERSION_TAG}"
              PROMOTE_BRANCH="promote/${GIT_TAG}"

              git config user.email "pipeline@azure-devops.com"
              git config user.name "Azure Pipeline"

              echo "##vso[task.setvariable variable=RELEASE_TAG]${RELEASE_TAG}"
              echo "##vso[task.setvariable variable=PROMOTE_BRANCH]${PROMOTE_BRANCH}"

              if git ls-remote --exit-code --tags origin "${RELEASE_TAG}" > /dev/null 2>&1; then
                echo "⚠️  Tag ${RELEASE_TAG} já existe — pulando criação"
              else
                git tag -a "${RELEASE_TAG}" "${COMMIT}" \
                  -m "Release ${RELEASE_TAG} — promovido de ${GIT_TAG}"
                git push origin "${RELEASE_TAG}"
                echo "✅ Tag criada: ${RELEASE_TAG} → ${COMMIT}"
              fi
            displayName: "🏷️ Criar tag semântica v* de produção"
            condition: and(succeeded(), eq('${{ lower(parameters.createSemanticTag) }}', 'true'))

          # ── Deleta branch promote/ ────────────────────────────────────────────
          - script: |
              set -euo pipefail

              PROMOTE_BRANCH="promote/${{ parameters.gitTagName }}"

              git config user.email "pipeline@azure-devops.com"
              git config user.name "Azure Pipeline"

              if git ls-remote --exit-code --heads origin "${PROMOTE_BRANCH}" > /dev/null 2>&1; then
                git push origin --delete "${PROMOTE_BRANCH}"
                echo "✅ Branch deletada: ${PROMOTE_BRANCH}"
              else
                echo "⚠️  Branch ${PROMOTE_BRANCH} já deletada — nenhuma ação necessária"
              fi
            displayName: "🧹 Deletar branch promote/ após merge"

          # ── Resumo do release ─────────────────────────────────────────────────
          - script: |
              set -euo pipefail
              echo ""
              echo "════════════════════════════════════════"
              echo "  ✅ Release concluído!"
              echo "════════════════════════════════════════"
              echo "  QA Tag:      ${{ parameters.gitTagName }}"
              echo "  Release Tag: $(RELEASE_TAG)"
              echo "  Commit:      ${{ parameters.commitSha }}"
              echo "════════════════════════════════════════"
            displayName: "📋 Resumo do release"
