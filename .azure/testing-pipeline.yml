name: "[TESTING] VERACIS #tag - $(Build.SourceBranchName) #buildId - $(Build.BuildId)"

trigger: none
resources:
  pipelines:
    - pipeline: buildPipeline
      source: "[BUILD] VERACIS"
      trigger:
        stages: [BuildAndPushAPI, BuildAndPushWeb]
        branches:
          include:
            - refs/tags/qa-*

variables:
  - group: Veracis-Registry
  - group: Veracis-Deploy-Testing
  - group: Veracis-DevOps-Config
  - name: GIT_TAG
    value: $(Build.SourceBranchName)

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/notify.yml
    parameters:
      stageName: NotifyApproval
      stageDisplayName: "🔔 Notify Approval"
      status: testing-waiting-approval
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_TESTING)
      environmentName: Testing
      gitTag: $(GIT_TAG)

  - template: templates/approval-gate.yml
    parameters:
      dependsOn: [NotifyApproval]

  - template: templates/detect-artifacts.yml
    parameters:
      stageName: DetectArtifacts
      stageDisplayName: "🔍 Detecting artifacts (API / Web)"
      apiArtifactName: build-metadata-api
      webArtifactName: build-metadata-web
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [ApprovalGate]
      condition: succeeded()

  - template: templates/deploy-ecs.yml
    parameters:
      stageName: DeployApi
      stageDisplayName: "🚀 Deploy Api"
      deploymentName: DeployToApi
      deploymentDisplayName: "Deploy veracis-api in ECS Testing"
      environmentName: running
      app: api
      metadataArtifactName: build-metadata-api
      ecrRepositoryVar: $(ECR_API_REPOSITORY)
      ecrRegistryVar: $(ECR_REGISTRY)
      ecsClusterVar: $(ECS_CLUSTER)
      ecsServiceVar: $(ECS_SERVICE_API)
      ecsTaskFamilyVar: $(ECS_TASK_DEFINITION_FAMILY_API)
      ecsContainerVar: $(ECS_CONTAINER_API)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      runMigration: true
      migrationCommand: "cd apps/api && node_modules/.bin/prisma migrate deploy && node dist/prisma/seed.js"
      variableGroups:
        - Veracis-Registry
        - Veracis-Deploy-Testing
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [DetectArtifacts]
      condition: eq(stageDependencies.DetectArtifacts.outputs['DetectArtifactsJob.DetectArtifactsStep.HAS_API'], 'true')

  - template: templates/deploy-ecs.yml
    parameters:
      stageName: DeployWeb
      stageDisplayName: "🚀 Deploy Web"
      deploymentName: DeployToWeb
      deploymentDisplayName: "Deploy veracis-web in ECS testing"
      environmentName: running
      app: web
      metadataArtifactName: build-metadata-web
      ecrRegistryVar: $(ECR_REGISTRY)
      ecrRepositoryVar: $(ECR_WEB_REPOSITORY)
      ecsClusterVar: $(ECS_CLUSTER)
      ecsServiceVar: $(ECS_SERVICE_WEB)
      ecsTaskFamilyVar: $(ECS_TASK_DEFINITION_FAMILY_WEB)
      ecsContainerVar: $(ECS_CONTAINER_WEB)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      runMigration: false
      variableGroups:
        - Veracis-Registry
        - Veracis-Deploy-Testing
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [DetectArtifacts]
      condition: eq(stageDependencies.DetectArtifacts.outputs['DetectArtifactsJob.DetectArtifactsStep.HAS_WEB'], 'true')

  - template: templates/notify.yml
    parameters:
      stageName: NotifyTestingSuccess
      stageDisplayName: "🔔 Notify Testing Success"
      status: testing-success
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_TESTING)
      environmentName: Testing
      gitTag: $(GIT_TAG)
      changedApps: $[ stageDependencies.DetectArtifacts.DetectArtifactsJob.outputs['DetectArtifactsStep.CHANGED_APPS'] ]
      dependsOn:
        - DeployApi
        - DeployWeb
        - DetectArtifacts
      condition: >
        and(
          eq(dependencies.DetectArtifacts.result, 'Succeeded'),
          in(dependencies.DeployApi.result, 'Succeeded', 'Skipped'),
          in(dependencies.DeployWeb.result, 'Succeeded', 'Skipped')
        )
