name: "[BUILD] VERACIS #tag - $(Build.SourceBranchName) #buildId - $(Build.BuildId)"

trigger:
  tags:
    include:
      - qa-*
  branches:
    exclude:
      - "*"

variables:
  - group: Veracis-Registry
  - group: Veracis-DevOps-Config
  - name: GIT_TAG
    value: $(Build.SourceBranchName)

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/notify.yml
    parameters:
      stageName: NotifyApproval
      stageDisplayName: "🔔 Notify Approval"
      status: build-waiting-approval
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_BUILD)
      environmentName: Testing
      gitTag: $(GIT_TAG)

  - template: templates/approval-gate.yml
    parameters:
      dependsOn: [NotifyApproval]

  - template: templates/detect-changes-tag.yml
    parameters:
      gitTag: $(GIT_TAG)
      dependsOn: [ApprovalGate]
      condition: "succeeded()"

  - template: templates/build-and-push.yml
    parameters:
      stageName: BuildAndPushAPI
      stageDisplayName: "🐳 Build And Push API"
      jobDisplayName: "Build veracis-api + push 3 tags ECR"
      app: api
      dockerImageName: veracis-api
      dockerfilePath: apps/api/Dockerfile
      dockerBuildContext: "."
      gitTagName: $(GIT_TAG)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      ecrRegistryVar: $(ECR_REGISTRY)
      ecrRepositoryVar: $(ECR_API_REPOSITORY)
      metadataArtifactName: build-metadata-api
      variableGroups:
        - Veracis-Registry
      dependsOn: DetectChanges
      condition: eq(stageDependencies.DetectChanges.outputs['DetectChangesJob.DetectChangesStep.CHANGED_API'], 'true')

  - template: templates/build-and-push.yml
    parameters:
      stageName: BuildAndPushWeb
      stageDisplayName: "🐳 Build And Push Web"
      jobDisplayName: "Build veracis-web + push 3 tags ECR"
      app: web
      dockerImageName: veracis-web
      dockerfilePath: apps/web/Dockerfile
      dockerBuildContext: "."
      gitTagName: $(GIT_TAG)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      ecrRegistryVar: $(ECR_REGISTRY)
      ecrRepositoryVar: $(ECR_WEB_REPOSITORY)
      metadataArtifactName: build-metadata-web
      variableGroups:
        - Veracis-Registry
      dependsOn: DetectChanges
      condition: eq(stageDependencies.DetectChanges.outputs['DetectChangesJob.DetectChangesStep.CHANGED_WEB'], 'true')

  - template: templates/notify.yml
    parameters:
      stageName: NotifyBuildSuccess
      stageDisplayName: "🔔 Notify Build Success"
      status: build-success
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_BUILD)
      environmentName: Testing
      changedApps: $[ stageDependencies.DetectChanges.DetectChangesJob.outputs['DetectChangesStep.CHANGED_APPS'] ]
      gitTag: $(GIT_TAG)
      dependsOn:
        - DetectChanges
        - BuildAndPushApi
        - BuildAndPushWeb
      condition: >
        and(
          eq(dependencies.DetectChanges.result, 'Succeeded'),
          in(dependencies.BuildAndPushApi.result, 'Succeeded', 'Skipped'),
          in(dependencies.BuildAndPushWeb.result, 'Succeeded', 'Skipped')
        )
