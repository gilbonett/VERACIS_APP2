name: "[BUILD AND PUSH] VERACIS - #tag $(Build.SourceBranchName) #buildId $(Build.BuildId)"

trigger:
  tags:
    include:
      - v*

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: Veracis-Registry
  - group: Veracis-DevOps-Config
  - name: GIT_TAG
    value: $(Build.SourceBranchName)

stages:
  - stage: ValidateAndDetectChanges
    displayName: "🔍 Validate and Detect Changes"
    jobs:
      - job: ValidateAndDetectChangesJob
        displayName: "🔍 Validate and Detect Changes Job"
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - template: "./steps/validate-version-by-tag.yml"
            parameters:
              gitTag: $(GIT_TAG)

          - template: "./steps/detect-changes-by-tag.yml"
            parameters:
              gitTag: $(GIT_TAG)

  - stage: BuildImageApiToArtifact
    displayName: "🐳 Build Docker Image API"
    dependsOn: ValidateAndDetectChanges
    condition: eq(stageDependencies.ValidateAndDetectChanges.outputs['ValidateAndDetectChangesJob.DetectChangesByTagStep.CHANGED_API'], 'true')
    jobs:
      - job: BuildImageApiToArtifactJob
        displayName: "🐳 Build Docker Image API Job"
        timeoutInMinutes: 40
        variables:
          - group: Veracis-Registry

        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - template: "./steps/set-build-date.yml"

          - template: "./steps/build-docker-image.yml"
            parameters:
              appName: api
              dockerImageName: veracis-api
              dockerfilePath: apps/api/Dockerfile
              labels: |
                org.opencontainers.image.revision=$(Build.SourceVersion)
                org.opencontainers.image.ref.name=$(Build.SourceBranchName)
                org.opencontainers.image.created=$(BUILD_DATE)
                pipeline.build.id=$(Build.BuildId)
                veracis.app=api

          - template: "./steps/save-docker-image.yml"
            parameters:
              appName: api
              dockerImageName: veracis-api

          - template: "./steps/publish-image-artifact.yml"
            parameters:
              appName: api

  - stage: PushImageApiToECR
    displayName: "☁️ Push Image API to ECR"
    dependsOn: BuildImageApiToArtifact
    condition: succeeded()
    jobs:
      - job: PushImageApiToECRJob
        displayName: "☁️ Push Image API to ECR Job"
        timeoutInMinutes: 40
        variables:
          - group: Veracis-Registry
        steps:
          - template: "./steps/download-image-artifact.yml"
            parameters:
              appName: api
              imageArtifactName: docker-image-api

          - template: "./steps/load-docker-image.yml"
            parameters:
              appName: api
              dockerImageName: veracis-api

          - template: "./steps/resolve-image-tags.yml"
            parameters:
              appName: api
              commitSha: $(Build.SourceVersion)
              gitTagName: $(GIT_TAG)
              versionTagPrefix: "v"

          - template: "./steps/push-image-ecr.yml"
            parameters:
              appName: api
              dockerImageName: veracis-api
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              awsRegion: $(AWS_REGION)
              ecrRegistry: $(ECR_REGISTRY)
              ecrRepository: $(ECR_API_REPOSITORY)
              tags: |
                $(VERSION_TAG)

          - template: "./steps/write-build-info-metadata.yml"
            parameters:
              appName: api
              dockerImageName: veracis-api
              ecrRegistry: $(ECR_REGISTRY)
              ecrRepository: $(ECR_API_REPOSITORY)
              imageTagSha: $(IMAGE_TAG_SHA)
              versionTag: $(VERSION_TAG)
              imageDigest: $(IMAGE_DIGEST)
              commitSha: $(Build.SourceVersion)
              branchName: $(Build.SourceBranchName)
              gitTagName: $(GIT_TAG)
              buildId: $(Build.BuildId)
              buildDate: $(BUILD_DATE)

  - stage: BuildImageWebToArtifact
    displayName: "🐳 Build Docker Image Web"
    dependsOn: ValidateAndDetectChanges
    condition: eq(stageDependencies.ValidateAndDetectChanges.outputs['ValidateAndDetectChangesJob.DetectChangesByTagStep.CHANGED_WEB'], 'true')
    jobs:
      - job: BuildImageWebToArtifactJob
        displayName: "🐳 Build Docker Image Web Job"
        timeoutInMinutes: 40
        variables:
          - group: Veracis-Registry

        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - template: "./steps/set-build-date.yml"

          - template: "./steps/build-docker-image.yml"
            parameters:
              appName: web
              dockerImageName: veracis-web
              dockerfilePath: apps/web/Dockerfile
              labels: |
                org.opencontainers.image.revision=$(Build.SourceVersion)
                org.opencontainers.image.ref.name=$(Build.SourceBranchName)
                org.opencontainers.image.created=$(BUILD_DATE)
                pipeline.build.id=$(Build.BuildId)
                veracis.app=web

          - template: "./steps/save-docker-image.yml"
            parameters:
              appName: web
              dockerImageName: veracis-web

          - template: "./steps/publish-image-artifact.yml"
            parameters:
              appName: web

  - stage: PushImageWebToECR
    displayName: "☁️ Push Image Web to ECR"
    dependsOn: BuildImageWebToArtifact
    condition: succeeded()
    jobs:
      - job: PushImageWebToECRJob
        displayName: "☁️ Push Image Web to ECR Job"
        timeoutInMinutes: 40
        variables:
          - group: Veracis-Registry
        steps:
          - template: "./steps/download-image-artifact.yml"
            parameters:
              appName: web
              imageArtifactName: docker-image-web

          - template: "./steps/load-docker-image.yml"
            parameters:
              appName: web
              dockerImageName: veracis-web

          - template: "./steps/resolve-image-tags.yml"
            parameters:
              appName: web
              commitSha: $(Build.SourceVersion)
              gitTagName: $(GIT_TAG)
              versionTagPrefix: "v"

          - template: "./steps/push-image-ecr.yml"
            parameters:
              appName: web
              dockerImageName: veracis-web
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              awsRegion: $(AWS_REGION)
              ecrRegistry: $(ECR_REGISTRY)
              ecrRepository: $(ECR_WEB_REPOSITORY)
              tags: |
                $(VERSION_TAG)

          - template: "./steps/write-build-info-metadata.yml"
            parameters:
              appName: web
              dockerImageName: veracis-web
              ecrRegistry: $(ECR_REGISTRY)
              ecrRepository: $(ECR_WEB_REPOSITORY)
              imageTagSha: $(IMAGE_TAG_SHA)
              versionTag: $(VERSION_TAG)
              imageDigest: $(IMAGE_DIGEST)
              commitSha: $(Build.SourceVersion)
              branchName: $(Build.SourceBranchName)
              gitTagName: $(GIT_TAG)
              buildId: $(Build.BuildId)
              buildDate: $(BUILD_DATE)

  - stage: NotifyToTeams
    displayName: "🔔 Notify to Teams"
    dependsOn:
      - ValidateAndDetectChanges
      - PushImageApiToECR
      - PushImageWebToECR
    condition: >
      and(
        eq(dependencies.ValidateAndDetectChanges.result, 'Succeeded'),
        in(dependencies.PushImageApiToECR.result, 'Succeeded', 'Skipped'),
        in(dependencies.PushImageWebToECR.result, 'Succeeded', 'Skipped'),
        or(
          eq(dependencies.PushImageApiToECR.result, 'Succeeded'),
          eq(dependencies.PushImageWebToECR.result, 'Succeeded')
        )
      )
    variables:
      CHANGED_APPS: $[ stageDependencies.ValidateAndDetectChanges.ValidateAndDetectChangesJob.outputs['DetectChangesByTagStep.CHANGED_APPS'] ]
    jobs:
      - job: NotifyToTeamsJob
        displayName: "🔔 Send notification in Teams"
        continueOnError: true
        timeoutInMinutes: 5
        variables:
          - group: Veracis-DevOps-Config
        steps:
          - template: "./steps/resolve-notification-status.yml"
            parameters:
              status: build-success

          - template: "./steps/resolve-mentions.yml"
            parameters:
              mentions: "$(TEAMS_MENTIONS_BUILD)"

          - template: "./steps/send-teams-notification.yml"
            parameters:
              webhookUrl: "$(TEAMS_WEBHOOK_URL)"
              gitTag: "$(GIT_TAG)"
              environmentName: "Building"
              changedApps: "$(CHANGED_APPS)"
