# ─────────────────────────────────────────────────────────────────────────────
# resolve-image-tags.yml
#
# Decide as tags que serão aplicadas na imagem no momento do push
# (SHA do commit + versão semântica opcional).
# Publica (isOutput): IMAGE_TAG_SHA, VERSION_TAG
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: appName
    type: string
  - name: commitSha
    type: string
  - name: gitTagName
    type: string
    default: ""
  - name: versionTagPrefix
    type: string
    default: "qa-"
  - name: stepName
    type: string
    default: ResolveImageTagsStep

steps:
  - bash: |
      set -euo pipefail

      SHORT_SHA="$(echo "${{ parameters.commitSha }}" | cut -c1-7)"
      GIT_TAG_NAME="${{ parameters.gitTagName }}"
      PREFIX="${{ parameters.versionTagPrefix }}"

      echo "##vso[task.setvariable variable=IMAGE_TAG_SHA;isOutput=true]${SHORT_SHA}"
      echo "##vso[task.setvariable variable=IMAGE_TAG_SHA]${SHORT_SHA}"

      if [ -n "${GIT_TAG_NAME}" ]; then
        VERSION_TAG="$(echo "${GIT_TAG_NAME}" | sed "s/^${PREFIX}//")"

        if ! echo "${VERSION_TAG}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ Invalid tag: '${GIT_TAG_NAME}'. Esperado: ${PREFIX}MAJOR.MINOR.PATCH"
          exit 1
        fi

        echo "##vso[task.setvariable variable=VERSION_TAG;isOutput=true]${VERSION_TAG}"
        echo "##vso[task.setvariable variable=VERSION_TAG]${VERSION_TAG}"
        echo "✅ Tags a aplicar (${{ parameters.appName }}): sha=${SHORT_SHA} | version=${VERSION_TAG} | latest"
      else
        echo "##vso[task.setvariable variable=VERSION_TAG;isOutput=true]"
        echo "##vso[task.setvariable variable=VERSION_TAG]"
        echo "✅ Tags a aplicar (${{ parameters.appName }}): sha=${SHORT_SHA} | latest"
      fi
    displayName: "🏷️ Resolve Image Tags — ${{ parameters.appName }}"
    name: ${{ parameters.stepName }}
