# ─────────────────────────────────────────────────────────────────────────────
# resolve-mentions.yml
#
# Parseia a lista de mentions (formato "Nome:email;Nome:email") e monta
# as entidades <at> do Teams + texto de menção.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mentions
    type: string
    default: ""

steps:
  - bash: |
      set -euo pipefail

      MENTIONS="${{ parameters.mentions }}"
      MENTION_ENTITIES="[]"
      MENTION_TEXT=""

      if [ -n "${MENTIONS}" ]; then
        ENTITIES=""
        TEXT=""

        IFS=';' read -ra ENTRIES <<< "${MENTIONS}"
        for ENTRY in "${ENTRIES[@]}"; do
          ENTRY="$(echo "${ENTRY}" | xargs)"
          [ -z "${ENTRY}" ] && continue

          NAME="$(echo "${ENTRY}" | cut -d':' -f1 | xargs)"
          EMAIL="$(echo "${ENTRY}" | cut -d':' -f2- | xargs)"
          [ -z "${NAME}" ] || [ -z "${EMAIL}" ] && continue

          [ -n "${ENTITIES}" ] && ENTITIES="${ENTITIES},"
          ENTITIES="${ENTITIES}{\"type\":\"mention\",\"text\":\"<at>${NAME}</at>\",\"mentioned\":{\"id\":\"${EMAIL}\",\"name\":\"${NAME}\"}}"
          [ -n "${TEXT}" ] && TEXT="${TEXT} "
          TEXT="${TEXT}<at>${NAME}</at>"
        done

        [ -n "${ENTITIES}" ] && MENTION_ENTITIES="[${ENTITIES}]"
        MENTION_TEXT="${TEXT}"
      fi

      echo "##vso[task.setvariable variable=NOTIFY_MENTION_ENTITIES]${MENTION_ENTITIES}"
      echo "##vso[task.setvariable variable=NOTIFY_MENTION_TEXT]${MENTION_TEXT}"

      echo "✅ Mentions resolvidas"
    displayName: "👥 Resolve Mentions"
