# ─────────────────────────────────────────────────────────────────────────────
# download-artifact-steps.yml
#
# Step reutilizável para download de um artifact.
# Suporta 3 modos via artifactSource:
#   - current  → mesmo pipeline
#   - specific → outro pipeline via resource
#   - promote  → outro pipeline usando TESTING_RUN_ID do promote-info.json
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: artifactName
    type: string
  - name: downloadPath
    type: string
  - name: artifactSource
    type: string
    default: current
    values:
      - current
      - specific
      - promote
  - name: ciResourceName
    type: string
    default: ""

steps:
  - ${{ if eq(parameters.artifactSource, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: "📥 Download ${{ parameters.artifactName }} (current)"
        continueOnError: true
        inputs:
          source: current
          artifact: ${{ parameters.artifactName }}
          path: ${{ parameters.downloadPath }}

  - ${{ if eq(parameters.artifactSource, 'specific') }}:
      - task: DownloadPipelineArtifact@2
        displayName: "📥 Download ${{ parameters.artifactName }} (specific)"
        continueOnError: true
        inputs:
          source: specific
          project: $(System.TeamProjectId)
          pipeline: $(resources.pipeline.${{ parameters.ciResourceName }}.pipelineID)
          runVersion: specific
          runId: $(resources.pipeline.${{ parameters.ciResourceName }}.runID)
          artifact: ${{ parameters.artifactName }}
          path: ${{ parameters.downloadPath }}

  - ${{ if eq(parameters.artifactSource, 'promote') }}:
      - task: DownloadPipelineArtifact@2
        displayName: "📥 Download ${{ parameters.artifactName }} (promote run ID)"
        continueOnError: true
        inputs:
          source: specific
          project: $(System.TeamProjectId)
          pipeline: $(resources.pipeline.${{ parameters.ciResourceName }}.pipelineID)
          runVersion: specific
          runId: $(BUILD_RUN_ID)
          artifact: ${{ parameters.artifactName }}
          path: ${{ parameters.downloadPath }}
