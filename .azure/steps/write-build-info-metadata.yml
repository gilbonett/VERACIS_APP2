# ─────────────────────────────────────────────────────────────────────────────
# write-build-info-metadata.yml
#
# Escreve um JSON de metadados do build/push (rastreabilidade) e publica
# como pipeline artifact.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: appName
    type: string
  - name: dockerImageName
    type: string
  - name: ecrRegistry
    type: string
  - name: ecrRepository
    type: string

  - name: imageTagSha
    type: string
  - name: versionTag
    type: string
    default: ""
  - name: imageDigest
    type: string
  - name: commitSha
    type: string
  - name: branchName
    type: string
  - name: gitTagName
    type: string
    default: ""
  - name: buildId
    type: string
  - name: buildDate
    type: string

  - name: metadataArtifactName
    type: string
    default: ""

steps:
  - bash: |
      set -euo pipefail
      META_DIR="$(Build.ArtifactStagingDirectory)/metadata"
      mkdir -p "${META_DIR}"

      FULL_IMAGE="${{ parameters.ecrRegistry }}/${{ parameters.ecrRepository }}"

      cat > "${META_DIR}/build-info-${{ parameters.appName }}.json" << EOF
      {
        "app":                "${{ parameters.appName }}",
        "imageName":          "${{ parameters.dockerImageName }}",
        "imageTag":           "${{ parameters.imageTagSha }}",
        "imageTagVersion":    "${{ parameters.versionTag }}",
        "imageTagLatest":     "latest",
        "imageDigest":        "${{ parameters.imageDigest }}",
        "commitSha":          "${{ parameters.commitSha }}",
        "branch":             "${{ parameters.branchName }}",
        "gitTag":             "${{ parameters.gitTagName }}",
        "buildId":            "${{ parameters.buildId }}",
        "buildDate":          "${{ parameters.buildDate }}",
        "ecrImageUri":        "${FULL_IMAGE}:${{ parameters.imageTagSha }}",
        "ecrImageUriVersion": "${FULL_IMAGE}:${{ parameters.versionTag }}",
        "ecrImageUriLatest":  "${FULL_IMAGE}:latest"
      }
      EOF

      echo "✅ Metadata ${{ parameters.appName }}:"
      cat "${META_DIR}/build-info-${{ parameters.appName }}.json"
    displayName: "📄 Write build-info-${{ parameters.appName }}.json"

  - task: PublishPipelineArtifact@1
    displayName: "📤 Publish metadata — ${{ parameters.appName }}"
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/metadata
      artifact: ${{ coalesce(parameters.metadataArtifactName, format('build-metadata-{0}', parameters.appName)) }}
      publishLocation: pipeline
