parameters:
  - name: gitTag
    type: string

steps:
  - bash: |
      set -euo pipefail

      GIT_TAG="${{ parameters.gitTag }}"
      echo "Tag: ${GIT_TAG}"

      if ! echo "${GIT_TAG}" | grep -qE '^(qa-|v)[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "❌ Invalid Tag: '${GIT_TAG}'"
        echo "Expected format: qa-MAJOR.MINOR.PATCH (ex: qa-1.0.0) or vMAJOR.MINOR.PATCH (ex: v1.2.3)"
        exit 1
      fi

      VERSION_TAG="$(echo "${GIT_TAG}" | sed -E 's/^(qa-|v)//')"
      MAJOR="$(echo "${VERSION_TAG}" | cut -d'.' -f1)"
      MINOR="$(echo "${VERSION_TAG}" | cut -d'.' -f2)"
      PATCH="$(echo "${VERSION_TAG}" | cut -d'.' -f3)"

      echo "##vso[task.setvariable variable=GIT_TAG_RESOLVED]${GIT_TAG}" # ex: v1.2.3
      echo "##vso[task.setvariable variable=VERSION_TAG;isOutput=true]${VERSION_TAG}" # ex: 1.2.3
      echo "##vso[task.setvariable variable=MAJOR;isOutput=true]${MAJOR}" # ex: 1
      echo "##vso[task.setvariable variable=MINOR;isOutput=true]${MINOR}" # ex: 2
      echo "##vso[task.setvariable variable=PATCH;isOutput=true]${PATCH}" # ex: 3

      echo "✅ Tag: ${GIT_TAG} → versão ${VERSION_TAG}"
    displayName: "🏷️ Validate Version Tag"
    name: ValidateVersionByTagStep
    workingDirectory: $(Build.SourcesDirectory)
