parameters:
  - name: appName
    type: string
  - name: imageArtifactName
    type: string
    default: ""
  - name: artifactStagingDirectory
    type: string
    default: "$(Build.ArtifactStagingDirectory)"

steps:
  - task: PublishPipelineArtifact@1
    displayName: "📤 Publish image artifact — ${{ parameters.appName }}"
    inputs:
      targetPath: ${{ parameters.artifactStagingDirectory }}/image
      artifact: ${{ coalesce(parameters.imageArtifactName, format('docker-image-{0}', parameters.appName)) }}
      publishLocation: pipeline
