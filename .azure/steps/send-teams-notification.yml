parameters:
  - name: webhookUrl
    type: string
  - name: gitTag
    type: string
    default: "no exists"
  - name: environmentName
    type: string
    default: "-"
  - name: changedApps
    type: string
    default: "No apps changed"
  - name: commitUrlTemplate
    type: string
    default: "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_git/$(Build.Repository.Name)/commit/$(Build.SourceVersion)"

steps:
  - bash: |
      set -euo pipefail

      GIT_TAG="${{ parameters.gitTag }}"
      GIT_TAG="${GIT_TAG#refs/tags/}"
      ENV="${{ parameters.environmentName }}"
      CHANGED_APPS="${{ parameters.changedApps }}"
      CHANGED_APPS_UPPER="${CHANGED_APPS^^}"

      STYLE="${NOTIFY_STYLE:-}"
      EMOJI="${NOTIFY_EMOJI:-}"
      TITLE="${NOTIFY_TITLE:-}"
      DESCRIPTION="${NOTIFY_DESCRIPTION:-}"
      MENTION_SUFFIX="${NOTIFY_MENTION_SUFFIX:-}"
      MENTION_ENTITIES="${NOTIFY_MENTION_ENTITIES:-[]}"
      MENTION_TEXT="${NOTIFY_MENTION_TEXT:-}"

      SHORT_COMMIT="$(echo "$(Build.SourceVersion)" | cut -c1-7)"
      PIPELINE_URL="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      COMMIT_URL="${{ parameters.commitUrlTemplate }}"

      MENTION_LINE=""
      if [ -n "${MENTION_TEXT}" ] && [ -n "${MENTION_SUFFIX}" ]; then
        MENTION_LINE="${MENTION_TEXT} — ${MENTION_SUFFIX}"
      fi

      DESCRIPTION_BLOCK=""
      if [ -n "${DESCRIPTION}" ]; then
        DESCRIPTION_BLOCK=",{\"type\":\"TextBlock\",\"text\":\"${DESCRIPTION}\",\"wrap\":true,\"spacing\":\"Small\",\"isSubtle\":true}"
      fi

      MENTION_BLOCK=""
      if [ -n "${MENTION_LINE}" ]; then
        MENTION_BLOCK=",{\"type\":\"TextBlock\",\"text\":\"${MENTION_LINE}\",\"wrap\":true,\"spacing\":\"Medium\",\"size\":\"Medium\"}"
      fi

      PAYLOAD="$(cat << EOF
      {
        "type": "message",
        "attachments": [{
          "contentType": "application/vnd.microsoft.card.adaptive",
          "content": {
            "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "type": "AdaptiveCard",
            "version": "1.4",
            "msteams": { "entities": ${MENTION_ENTITIES} },
            "body": [
              {
                "type": "Container",
                "style": "${STYLE}",
                "bleed": true,
                "items": [
                  {
                    "type": "ColumnSet",
                    "columns": [
                      { "type": "Column", "width": "auto", "items": [ { "type": "TextBlock", "text": "${EMOJI}", "size": "ExtraLarge" } ] },
                      {
                        "type": "Column",
                        "width": "stretch",
                        "verticalContentAlignment": "Center",
                        "items": [
                          { "type": "TextBlock", "text": "${TITLE}", "weight": "Bolder", "size": "Large", "wrap": true },
                          { "type": "TextBlock", "text": "${ENV}", "isSubtle": true, "spacing": "None" }
                        ]
                      }
                    ]
                  }
                ]
              }
              ${DESCRIPTION_BLOCK}
              ,{
                "type": "ColumnSet",
                "spacing": "Medium",
                "columns": [
                  { "type": "Column", "width": "stretch", "items": [ { "type": "TextBlock", "text": "Tag", "isSubtle": true, "size": "Small" }, { "type": "TextBlock", "text": "${GIT_TAG}", "weight": "Bolder", "wrap": true } ] },
                  { "type": "Column", "width": "stretch", "items": [ { "type": "TextBlock", "text": "Apps", "isSubtle": true, "size": "Small" }, { "type": "TextBlock", "text": "${CHANGED_APPS_UPPER}", "weight": "Bolder", "wrap": true } ] }
                ]
              }
              ,{
                "type": "Container",
                "spacing": "Medium",
                "separator": true,
                "items": [
                  {
                    "type": "FactSet",
                    "facts": [
                      { "title": "Commit", "value": "${SHORT_COMMIT}" },
                      { "title": "Branch", "value": "$(Build.SourceBranchName)" },
                      { "title": "Build", "value": "$(Build.BuildId)" },
                      { "title": "Solicitado por", "value": "$(Build.RequestedFor)" }
                    ]
                  }
                ]
              }
              ${MENTION_BLOCK}
            ],
            "actions": [
              { "type": "Action.OpenUrl", "title": "🔍 Ver Pipeline", "url": "${PIPELINE_URL}" },
              { "type": "Action.OpenUrl", "title": "📝 Ver Commit", "url": "${COMMIT_URL}" }
            ]
          }
        }]
      }
      EOF
      )"

      HTTP_STATUS="$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Content-Type: application/json" \
        -d "${PAYLOAD}" \
        "${{ parameters.webhookUrl }}")"

      [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "202" ] \
        && echo "✅ Teams notificated (HTTP ${HTTP_STATUS})" \
        || echo "⚠️  Teams returned HTTP ${HTTP_STATUS} — continuing"
    displayName: "📨 Send Teams Notification"
    env:
      NOTIFY_STYLE: $(NOTIFY_STYLE)
      NOTIFY_EMOJI: $(NOTIFY_EMOJI)
      NOTIFY_TITLE: $(NOTIFY_TITLE)
      NOTIFY_DESCRIPTION: $(NOTIFY_DESCRIPTION)
      NOTIFY_MENTION_SUFFIX: $(NOTIFY_MENTION_SUFFIX)
      NOTIFY_MENTION_ENTITIES: $(NOTIFY_MENTION_ENTITIES)
      NOTIFY_MENTION_TEXT: $(NOTIFY_MENTION_TEXT)
