# ─────────────────────────────────────────────────────────────────────────────
# load-docker-image.yml
#
# Carrega a imagem Docker a partir do tarball baixado (download-image-artifact.yml)
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: appName
    type: string
  - name: dockerImageName
    type: string
  - name: downloadPath
    type: string
    default: "$(Pipeline.Workspace)/image"

steps:
  - bash: |
      set -euo pipefail
      gunzip -c "${{ parameters.downloadPath }}/${{ parameters.appName }}.tar.gz" | docker load
      docker images | grep "${{ parameters.dockerImageName }}" || true
    displayName: "📦 Load image from tarball — ${{ parameters.appName }}"
