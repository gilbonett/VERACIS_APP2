# ─────────────────────────────────────────────────────────────────────────────
# deploy-ecs-steps.yml
#
# Steps reutilizáveis de deploy no ECS.
# Baixa o artifact do pipeline ATUAL (mesmo pipeline de QA)
# e usa a tag semântica (ex: 1.0.0) para identificar a imagem no ECR.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: app
    type: string
  - name: metadataArtifactName
    type: string
  - name: ecrRegistryVar
    type: string
  - name: ecrRepositoryVar
    type: string
  - name: ecsClusterVar
    type: string
  - name: ecsServiceVar
    type: string
  - name: ecsTaskFamilyVar
    type: string
  - name: ecsContainerVar
    type: string
  - name: awsCredentials
    type: string
  - name: awsRegionVar
    type: string
  - name: runMigration
    type: boolean
    default: false
  - name: migrationCommand
    type: string
    default: ""
  - name: artifactSource
    type: string
    default: current
    values:
      - current
      - specific
      - promote
  - name: ciResourceName
    type: string
    default: ""

steps:
  - checkout: none

  # ── Download via step reutilizável ─────────────────────────────────────────
  - template: download-artifact-steps.yml
    parameters:
      artifactName: ${{ parameters.metadataArtifactName }}
      downloadPath: $(Pipeline.Workspace)/build-metadata
      artifactSource: ${{ parameters.artifactSource }}
      ciResourceName: ${{ parameters.ciResourceName }}

  # ── Lê metadata e monta URI usando a tag semântica ─────────────────────────
  - script: |
      set -euo pipefail
      METADATA="$(Pipeline.Workspace)/build-metadata/build-info-${{ parameters.app }}.json"
      [ -f "${METADATA}" ] || { echo "❌ Metadata não encontrada: ${METADATA}"; exit 1; }

      IMAGE_TAG=$(python3 -c "import json; d=json.load(open('${METADATA}')); print(d['imageTag'])")
      VERSION_TAG=$(python3 -c "import json; d=json.load(open('${METADATA}')); print(d.get('imageTagVersion',''))")
      GIT_TAG=$(python3 -c "import json; d=json.load(open('${METADATA}')); print(d.get('gitTag',''))")
      COMMIT_SHA=$(python3 -c "import json; d=json.load(open('${METADATA}')); print(d['commitSha'])")
      BUILD_DATE=$(python3 -c "import json; d=json.load(open('${METADATA}')); print(d['buildDate'])")

      FULL_IMAGE="${{ parameters.ecrRegistryVar }}/${{ parameters.ecrRepositoryVar }}"

      # Usa a tag semântica (ex: 1.0.0) se disponível, senão usa SHA
      if [ -n "${VERSION_TAG}" ]; then
        ECR_IMAGE_URI="${FULL_IMAGE}:${VERSION_TAG}"
        echo "✅ Usando tag semântica: ${ECR_IMAGE_URI}"
      else
        ECR_IMAGE_URI="${FULL_IMAGE}:${IMAGE_TAG}"
        echo "⚠️  Sem tag semântica — usando SHA: ${ECR_IMAGE_URI}"
      fi

      echo "##vso[task.setvariable variable=IMAGE_TAG]${IMAGE_TAG}"
      echo "##vso[task.setvariable variable=VERSION_TAG]${VERSION_TAG}"
      echo "##vso[task.setvariable variable=ECR_IMAGE_URI]${ECR_IMAGE_URI}"
      echo "##vso[task.setvariable variable=COMMIT_SHA]${COMMIT_SHA}"
      echo "##vso[task.setvariable variable=BUILD_DATE]${BUILD_DATE}"
      echo "##vso[task.setvariable variable=GIT_TAG]${GIT_TAG}"

      echo ""
      echo "📦 ${{ parameters.app }}:"
      echo "   sha:     ${IMAGE_TAG}"
      echo "   version: ${VERSION_TAG}"
      echo "   image:   ${ECR_IMAGE_URI}"
    displayName: "📄 Read image metadata and resolve image URIs"

  # ── Verifica se a imagem existe no ECR ─────────────────────────────────────
  - task: AWSShellScript@1
    displayName: "🔍 Verify image exists in ECR — ${{ parameters.app }}"
    inputs:
      awsCredentials: "${{ parameters.awsCredentials }}"
      regionName: "${{ parameters.awsRegionVar }}"
      scriptType: "inline"
      inlineScript: |
        set -euo pipefail
        aws ecr describe-images \
          --repository-name "${{ parameters.ecrRepositoryVar }}" \
          --image-ids imageTag="$(VERSION_TAG)" \
          --region "${{ parameters.awsRegionVar }}" \
          --query 'imageDetails[0].{tag:imageTags,pushed:imagePushedAt,digest:imageDigest}' \
          --output table
        echo "✅ Imagem $(VERSION_TAG) confirmada no ECR."

  # ── Registra nova task definition com a imagem atualizada ──────────────────
  - task: AWSShellScript@1
    displayName: "📋 Update Task Definition — ${{ parameters.app }}"
    inputs:
      awsCredentials: "${{ parameters.awsCredentials }}"
      regionName: "${{ parameters.awsRegionVar }}"
      scriptType: "inline"
      inlineScript: |
        set -euo pipefail

        IMAGE="$(ECR_IMAGE_URI)"
        APP_VERSION="$(VERSION_TAG)"
        CONTAINER="${{ parameters.ecsContainerVar }}"
        FAMILY="${{ parameters.ecsTaskFamilyVar }}"
        REGION="${{ parameters.awsRegionVar }}"


        if [ "${APP_VERSION}" = "${IMAGE}" ]; then
          APP_VERSION="unknown"
        fi

        echo "🐳 Atualizando container '${CONTAINER}' para imagem: ${IMAGE}"
        echo "🏷️  APP_VERSION: ${APP_VERSION}"

        TMP_IN="$(mktemp /tmp/td-in.XXXXXX.json)"
        TMP_OUT="$(mktemp /tmp/td-out.XXXXXX.json)"

        aws ecs describe-task-definition \
          --task-definition "${FAMILY}" \
          --region "${REGION}" \
          --query 'taskDefinition' \
          --output json > "${TMP_IN}"

        python3 - "${CONTAINER}" "${IMAGE}" "${APP_VERSION}" "${TMP_IN}" "${TMP_OUT}" << 'PY'
        import json, sys

        container, image, app_version, in_path, out_path = (
            sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
        )

        with open(in_path, "r", encoding="utf-8") as f:
            td = json.load(f)

        # Remove campos read-only que não podem ser enviados no register-task-definition
        for k in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                  "compatibilities", "registeredAt", "registeredBy"):
            td.pop(k, None)

        found = False
        for c in td.get("containerDefinitions", []):
            if c.get("name") != container:
                continue

            c["image"] = image

            # Garante que a lista 'environment' existe
            env_list = c.setdefault("environment", [])

            # Atualiza/insere APP_VERSION sem duplicar e preservando as outras envs
            updated = False
            for entry in env_list:
                if entry.get("name") == "APP_VERSION":
                    entry["value"] = app_version
                    updated = True
                    break
            if not updated:
                env_list.append({"name": "APP_VERSION", "value": app_version})

            found = True
            break

        if not found:
            raise SystemExit(f"Container não encontrado: {container}")

        with open(out_path, "w", encoding="utf-8") as f:
            json.dump(td, f)
        PY

        python3 -m json.tool "${TMP_OUT}" > /dev/null

        NEW_ARN="$(aws ecs register-task-definition \
          --region "${REGION}" \
          --cli-input-json "file://${TMP_OUT}" \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)"

        rm -f "${TMP_IN}" "${TMP_OUT}"

        [ -n "${NEW_ARN}" ] && [ "${NEW_ARN}" != "None" ] || { echo "❌ Falha ao registrar task definition"; exit 1; }

        echo "##vso[task.setvariable variable=NEW_TASK_DEF_ARN]${NEW_ARN}"
        echo "##vso[task.setvariable variable=APP_VERSION]${APP_VERSION}"
        echo "✅ Registrada: ${NEW_ARN}"
        echo "✅ APP_VERSION: ${APP_VERSION}"

  # ── Migration (opcional) ────────────────────────────────────────────────────
  - ${{ if eq(parameters.runMigration, true) }}:
      - task: AWSShellScript@1
        displayName: "🗄️ Run migration to database"
        inputs:
          awsCredentials: "${{ parameters.awsCredentials }}"
          regionName: "${{ parameters.awsRegionVar }}"
          scriptType: "inline"
          inlineScript: |
            set -euo pipefail
            CLUSTER="${{ parameters.ecsClusterVar }}"
            TASK_DEF="$(NEW_TASK_DEF_ARN)"

            NETWORK_CONFIG="$(aws ecs describe-services \
              --cluster "${CLUSTER}" \
              --services "${{ parameters.ecsServiceVar }}" \
              --region "${{ parameters.awsRegionVar }}" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration' \
              --output json)"
            SUBNETS="$(echo "${NETWORK_CONFIG}" | python3 -c "import json,sys; print(','.join(json.load(sys.stdin)['subnets']))")"
            SECURITY_GROUPS="$(echo "${NETWORK_CONFIG}" | python3 -c "import json,sys; print(','.join(json.load(sys.stdin)['securityGroups']))")"
            ASSIGN_PUBLIC_IP="DISABLED"

            OVERRIDES="$(python3 -c "import json; print(json.dumps({'containerOverrides':[{'name':'${{ parameters.ecsContainerVar }}','command':['sh','-c','${{ parameters.migrationCommand }}']}]}))")"

            TASK_ARN="$(aws ecs run-task \
              --cluster "${CLUSTER}" \
              --task-definition "${TASK_DEF}" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
              --overrides "${OVERRIDES}" \
              --region "${{ parameters.awsRegionVar }}" \
              --query 'tasks[0].taskArn' \
              --output text)"
            [ -n "${TASK_ARN}" ] && [ "${TASK_ARN}" != "None" ] || { echo "❌ Falha ao iniciar migration"; exit 1; }
            echo "⏳ Aguardando migration: ${TASK_ARN}"
            aws ecs wait tasks-stopped \
              --cluster "${CLUSTER}" \
              --tasks "${TASK_ARN}" \
              --region "${{ parameters.awsRegionVar }}"
            RESULT="$(aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks "${TASK_ARN}" \
              --region "${{ parameters.awsRegionVar }}" \
              --query 'tasks[0]' \
              --output json)"
            EXIT_CODE="$(echo "${RESULT}" | python3 -c "import json,sys; t=json.load(sys.stdin); n='${{ parameters.ecsContainerVar }}'; print(next((c.get('exitCode','NO_EXIT_CODE') for c in t.get('containers',[]) if c.get('name')==n),'CONTAINER_NOT_FOUND'))")"
            [ "${EXIT_CODE}" = "0" ] || { echo "❌ Migration falhou (exit=${EXIT_CODE})"; exit 1; }
            echo "✅ Migration concluída"

  # ── Atualiza o serviço ECS ──────────────────────────────────────────────────
  - task: AWSShellScript@1
    displayName: "🚀 Update ECS service — ${{ parameters.app }}"
    inputs:
      awsCredentials: "${{ parameters.awsCredentials }}"
      regionName: "${{ parameters.awsRegionVar }}"
      scriptType: "inline"
      inlineScript: |
        set -euo pipefail
        aws ecs update-service \
          --cluster "${{ parameters.ecsClusterVar }}" \
          --service "${{ parameters.ecsServiceVar }}" \
          --task-definition "$(NEW_TASK_DEF_ARN)" \
          --force-new-deployment \
          --region "${{ parameters.awsRegionVar }}" \
          --query 'service.{status:status,desired:desiredCount,running:runningCount,pending:pendingCount}' \
          --output table

  # ── Aguarda o serviço estabilizar ──────────────────────────────────────────
  - task: AWSShellScript@1
    displayName: "⏳ Already in steady state — ${{ parameters.app }}"
    inputs:
      awsCredentials: "${{ parameters.awsCredentials }}"
      regionName: "${{ parameters.awsRegionVar }}"
      scriptType: "inline"
      inlineScript: |
        set -euo pipefail
        CLUSTER="${{ parameters.ecsClusterVar }}"
        SERVICE="${{ parameters.ecsServiceVar }}"
        REGION="${{ parameters.awsRegionVar }}"

        aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}" --region "${REGION}" || true

        SVC="$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --region "${REGION}" --query 'services[0]' --output json)"
        DESIRED="$(echo "${SVC}" | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('desiredCount',0))")"
        RUNNING="$(echo "${SVC}" | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('runningCount',0))")"
        PENDING="$(echo "${SVC}" | python3 -c "import sys,json; s=json.load(sys.stdin); print(s.get('pendingCount',0))")"
        FAILED="$(echo "${SVC}" | python3 -c "import sys,json; s=json.load(sys.stdin); print(sum(1 for d in s.get('deployments',[]) if d.get('rolloutState')=='FAILED'))")"

        echo "running=${RUNNING} desired=${DESIRED} pending=${PENDING} failed=${FAILED}"
        [ "${RUNNING}" -eq "${DESIRED}" ] && [ "${PENDING}" -eq 0 ] && [ "${FAILED}" -eq 0 ] && exit 0
        exit 1

  # ── Diagnóstico em caso de falha ────────────────────────────────────────────
  - task: AWSShellScript@1
    displayName: "🧯 Diagnose failure — ${{ parameters.app }}"
    condition: failed()
    inputs:
      awsCredentials: "${{ parameters.awsCredentials }}"
      regionName: "${{ parameters.awsRegionVar }}"
      scriptType: "inline"
      inlineScript: |
        set -euo pipefail
        CLUSTER="${{ parameters.ecsClusterVar }}"
        SERVICE="${{ parameters.ecsServiceVar }}"
        REGION="${{ parameters.awsRegionVar }}"

        echo "=== Status do serviço ${{ parameters.app }} ==="
        aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --region "${REGION}" \
          --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].[id,status,rolloutState]}' \
          --output json || true

        echo "=== Últimos eventos ==="
        aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --region "${REGION}" \
          --query 'services[0].events[0:10].[createdAt,message]' \
          --output table || true
