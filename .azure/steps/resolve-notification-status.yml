# ─────────────────────────────────────────────────────────────────────────────
# resolve-notification-status.yml
#
# Resolve cor, emoji, título e descrição de acordo com o status do pipeline.
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: status
    type: string
    values:
      - waiting-approval
      - prod-waiting-approval
      - build-waiting-approval
      - testing-waiting-approval
      - build-success
      - testing-started
      - testing-success
      - prod-started
      - prod-success
      - rejected-tag
      - failure

steps:
  - bash: |
      set -euo pipefail

      STATUS="${{ parameters.status }}"

      case "${STATUS}" in
        waiting-approval)
          STYLE="warning"; EMOJI="⏳"; TITLE="Waiting Approval"
          DESCRIPTION="The pipeline is awaiting approval to continue. Check that the environment is available and go ahead and start the deployment."
          MENTION_SUFFIX="Approval required to continue the deployment. ⏳"
          ;;
        prod-waiting-approval)
          STYLE="warning"; EMOJI="⏳"; TITLE="Waiting Approval (Production)"
          DESCRIPTION="The production deployment pipeline is awaiting approval to continue."
          MENTION_SUFFIX="Waiting approval for deployment to production. ⏳"
          ;;
        testing-waiting-approval)
          STYLE="warning"; EMOJI="⏳"; TITLE="Waiting Approval (Testing)"
          DESCRIPTION="The testing deployment pipeline is awaiting approval to continue."
          MENTION_SUFFIX="Waiting approval for deployment to the testing environment. ⏳"
          ;;
        build-waiting-approval)
          STYLE="warning"; EMOJI="⏳"; TITLE="Waiting Approval (Build)"
          DESCRIPTION="The build pipeline is awaiting approval to continue. A new version has been created and is awaiting approval."
          MENTION_SUFFIX="Waiting for approval to continue the build. ⏳"
          ;;
        build-success)
          STYLE="good"; EMOJI="🐳"; TITLE="Success (Build)"
          DESCRIPTION="The Docker images have been built and published to ECR. Deployment to the testing environment will begin shortly."
          MENTION_SUFFIX="Build complete, deploying to testing. 🐳"
          ;;
        testing-started)
          STYLE="accent"; EMOJI="🚀"; TITLE="Started (Testing)"
          DESCRIPTION="The deployment process to the testing environment has begun and is currently in progress. Check the pipeline for more details."
          MENTION_SUFFIX="Deployment to testing has begun. 🚀"
          ;;
        testing-success)
          STYLE="good"; EMOJI="🧪"; TITLE="Deploy Success (Testing)"
          DESCRIPTION="The deployment to the testing environment was successful. The environment is ready for QA validation."
          MENTION_SUFFIX="Testing environment ready for validation. 🧪"
          ;;
        prod-started)
          STYLE="accent"; EMOJI="🚀"; TITLE="Started (Production)"
          DESCRIPTION="The production deployment process has been approved and is currently underway. Check the pipeline for more details."
          MENTION_SUFFIX="Deployment to production has begun. 🚀"
          ;;
        prod-success)
          STYLE="good"; EMOJI="✅"; TITLE="Deploy Success (Production)"
          DESCRIPTION="The deployment to production was successful. The version is now available to users."
          MENTION_SUFFIX="Deployment to production has completed successfully! ✅"
          ;;
        rejected-tag)
          STYLE="attention"; EMOJI="🚫"; TITLE="Tag Version Rejected"
          DESCRIPTION="The tag version was rejected. The implementation failed the test validations."
          MENTION_SUFFIX="The tag version was rejected. The implementation failed the test validations. 🚫"
          ;;
        failure)
          STYLE="attention"; EMOJI="⚠️"; TITLE="Deploy Failure"
          DESCRIPTION="An error occurred during the pipeline. Click the link below to view the logs and identify the issue."
          MENTION_SUFFIX="The pipeline failed, check the logs! ⚠️"
          ;;
        *)
          STYLE="default"; EMOJI="ℹ️"; TITLE="Notificação"
          DESCRIPTION=""
          MENTION_SUFFIX=""
          ;;
      esac

      echo "##vso[task.setvariable variable=NOTIFY_STYLE]${STYLE}"
      echo "##vso[task.setvariable variable=NOTIFY_EMOJI]${EMOJI}"
      echo "##vso[task.setvariable variable=NOTIFY_TITLE]${TITLE}"
      echo "##vso[task.setvariable variable=NOTIFY_DESCRIPTION]${DESCRIPTION}"
      echo "##vso[task.setvariable variable=NOTIFY_MENTION_SUFFIX]${MENTION_SUFFIX}"

      echo "✅ Status resolvido: ${STYLE} | ${EMOJI} | ${TITLE}"
    displayName: "🎨 Resolve Notification Status"
