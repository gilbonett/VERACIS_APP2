# ─────────────────────────────────────────────────────────────────────────────
# push-image-ecr.yml
#
# Faz login no ECR, re-tageia a imagem local (:latest) com as tags informadas
# e publica no repositório ECR. "latest" é sempre incluída automaticamente.
# Tags vazias (ex.: variável não resolvida) são ignoradas.
# Publica: ECR_IMAGE_URI, IMAGE_DIGEST
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: appName
    type: string
  - name: dockerImageName
    type: string
  - name: awsCredentials
    type: string
  - name: awsRegion
    type: string
  - name: ecrRegistry
    type: string
  - name: ecrRepository
    type: string
  # lista de tags adicionais a aplicar (além de "latest"), uma por linha.
  # cada linha pode ser uma variável runtime, ex: $(VERSION_TAG)
  - name: tags
    type: string
    default: ""

steps:
  - task: AWSShellScript@1
    displayName: "☁️ Login + Tag + Push ECR — ${{ parameters.appName }}"
    inputs:
      awsCredentials: "${{ parameters.awsCredentials }}"
      regionName: "${{ parameters.awsRegion }}"
      scriptType: "inline"
      inlineScript: |
        set -euo pipefail

        FULL_IMAGE="${{ parameters.ecrRegistry }}/${{ parameters.ecrRepository }}"
        LOCAL_IMAGE="${{ parameters.dockerImageName }}:latest"

        mapfile -t RAW_TAGS <<< "${{ parameters.tags }}"

        declare -A SEEN
        FINAL_TAGS=()

        add_tag() {
          local t="$1"
          [ -z "${t}" ] && return
          if [ -z "${SEEN[$t]:-}" ]; then
            SEEN[$t]=1
            FINAL_TAGS+=("${t}")
          fi
        }

        add_tag "latest"
        for t in "${RAW_TAGS[@]}"; do
          add_tag "${t}"
        done

        echo "🏷️  Tags a aplicar: ${FINAL_TAGS[*]}"

        aws ecr get-login-password --region "${{ parameters.awsRegion }}" \
          | docker login --username AWS --password-stdin "${{ parameters.ecrRegistry }}"

        MAIN_TAG=""
        for TAG in "${FINAL_TAGS[@]}"; do
          docker tag "${LOCAL_IMAGE}" "${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:${TAG}"
          echo "✅ ${FULL_IMAGE}:${TAG}"
          [ -z "${MAIN_TAG}" ] && [ "${TAG}" != "latest" ] && MAIN_TAG="${TAG}"
        done

        [ -z "${MAIN_TAG}" ] && MAIN_TAG="latest"

        DIGEST="$(aws ecr describe-images \
          --repository-name "${{ parameters.ecrRepository }}" \
          --image-ids imageTag="${MAIN_TAG}" \
          --region "${{ parameters.awsRegion }}" \
          --query 'imageDetails[0].imageDigest' \
          --output text)"

        echo "##vso[task.setvariable variable=ECR_IMAGE_URI]${FULL_IMAGE}:${MAIN_TAG}"
        echo "##vso[task.setvariable variable=IMAGE_DIGEST]${DIGEST}"
