parameters:
  - name: appName
    type: string
  - name: dockerfilePath
    type: string
  - name: dockerImageName
    type: string
  - name: dockerBuildContext
    type: string
    default: "."
  - name: dockerBuildArgs
    type: string
    default: ""
  - name: labels
    type: string
    default: ""

steps:
  - bash: |
      set -euo pipefail

      mapfile -t LINES <<< "${{ parameters.labels }}"
      LABEL_ARGS=()
      for line in "${LINES[@]}"; do
        [ -n "$line" ] && LABEL_ARGS+=(--label "$line")
      done

      docker build \
        -f "${{ parameters.dockerfilePath }}" \
        -t "${{ parameters.dockerImageName }}:latest" \
        ${{ parameters.dockerBuildArgs }} \
        "${LABEL_ARGS[@]}" \
        "${{ parameters.dockerBuildContext }}"

      echo "✅ Docker image built: ${{ parameters.dockerImageName }}:latest"
    displayName: "🐳 Build Docker — ${{ parameters.appName }}"
