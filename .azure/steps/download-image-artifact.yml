# ─────────────────────────────────────────────────────────────────────────────
# download-image-artifact.yml
#
# Step reutilizável para download da imagem Docker (tarball) publicada como
# artifact. Suporta 3 modos via artifactSource:
#   - current  → mesmo pipeline
#   - specific → outro pipeline via resource (pipelineId + runId explícitos)
#   - promote  → outro pipeline usando runId vindo do promote-info.json
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: appName
    type: string
  - name: imageArtifactName
    type: string
    default: ""
  - name: downloadPath
    type: string
    default: "$(Pipeline.Workspace)/image"

  - name: artifactSource
    type: string
    default: current
    values:
      - current
      - specific
      - promote

  # usados apenas quando artifactSource = specific | promote
  - name: projectId
    type: string
    default: ""
  - name: pipelineId
    type: string
    default: ""

  # usado apenas quando artifactSource = specific
  - name: runId
    type: string
    default: ""

  # usado apenas quando artifactSource = promote
  - name: buildRunId
    type: string
    default: ""

steps:
  - ${{ if eq(parameters.artifactSource, 'current') }}:
      - task: DownloadPipelineArtifact@2
        displayName: "📥 Download image — ${{ parameters.appName }} (current)"
        continueOnError: true
        inputs:
          source: current
          artifact: ${{ coalesce(parameters.imageArtifactName, format('docker-image-{0}', parameters.appName)) }}
          path: ${{ parameters.downloadPath }}

  - ${{ if eq(parameters.artifactSource, 'specific') }}:
      - task: DownloadPipelineArtifact@2
        displayName: "📥 Download image — ${{ parameters.appName }} (specific)"
        continueOnError: true
        inputs:
          source: specific
          project: ${{ parameters.projectId }}
          pipeline: ${{ parameters.pipelineId }}
          runVersion: specific
          runId: ${{ parameters.runId }}
          artifact: ${{ coalesce(parameters.imageArtifactName, format('docker-image-{0}', parameters.appName)) }}
          path: ${{ parameters.downloadPath }}

  - ${{ if eq(parameters.artifactSource, 'promote') }}:
      - task: DownloadPipelineArtifact@2
        displayName: "📥 Download image — ${{ parameters.appName }} (promote run ID)"
        continueOnError: true
        inputs:
          source: specific
          project: ${{ parameters.projectId }}
          pipeline: ${{ parameters.pipelineId }}
          runVersion: specific
          runId: ${{ parameters.buildRunId }}
          artifact: ${{ coalesce(parameters.imageArtifactName, format('docker-image-{0}', parameters.appName)) }}
          path: ${{ parameters.downloadPath }}
