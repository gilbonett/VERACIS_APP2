parameters:
  - name: appName
    type: string
  - name: dockerImageName
    type: string
  - name: artifactStagingDirectory
    type: string
    default: "$(Build.ArtifactStagingDirectory)"

steps:
  - bash: |
      set -euo pipefail
      mkdir -p "${{ parameters.artifactStagingDirectory }}/image"

      docker save "${{ parameters.dockerImageName }}:latest" \
        | gzip > "${{ parameters.artifactStagingDirectory }}/image/${{ parameters.appName }}.tar.gz"

      echo "✅ Image saved as compressed tarball"
      ls -lh "${{ parameters.artifactStagingDirectory }}/image"
    displayName: "💾 Save image as tarball (gzip) — ${{ parameters.appName }}"
