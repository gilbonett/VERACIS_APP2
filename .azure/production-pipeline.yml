name: "[PROD] VERACIS #tag - $(Build.SourceBranchName) #buildId $(Build.BuildId)"

trigger: none
resources:
  pipelines:
    - pipeline: buildPipeline
      source: "[BUILD] VERACIS"
      trigger:
        stages: [BuildAndPushAPI, BuildAndPushWeb]
        branches:
          include:
            - refs/tags/qa-*

variables:
  - group: Veracis-Registry
  - group: Veracis-Deploy-Production
  - group: Veracis-DevOps-Config
  - name: GIT_TAG
    value: $(Build.SourceBranchName)

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/notify.yml
    parameters:
      stageName: NotifyApproval
      stageDisplayName: "🔔 Notify Approval"
      status: prod-waiting-approval
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_PRODUCTION)
      environmentName: Testing
      gitTag: $(GIT_TAG)

  - template: templates/approval-gate.yml
    parameters:
      environmentName: production
      dependsOn: [NotifyApproval]

  - template: templates/detect-artifacts.yml
    parameters:
      stageName: ApproveDetectArtifacts
      stageDisplayName: "🔍 Detecting artifacts (API / Web)"
      apiArtifactName: build-metadata-api
      webArtifactName: build-metadata-web
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [ApprovalGate]
      condition: succeeded()

  - template: templates/detect-artifacts.yml
    parameters:
      stageName: RejectDetectArtifacts
      stageDisplayName: "🔍 Detecting artifacts (API / Web)"
      apiArtifactName: build-metadata-api
      webArtifactName: build-metadata-web
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [ApprovalGate]
      condition: failed()

  - template: templates/deploy-ecs.yml
    parameters:
      stageName: DeployApi
      stageDisplayName: "🚀 Deploy Api"
      deploymentName: DeployToApi
      deploymentDisplayName: "Deploy veracis-api in ECS Production"
      environmentName: running
      app: api
      metadataArtifactName: build-metadata-api
      ecrRepositoryVar: $(ECR_API_REPOSITORY)
      ecrRegistryVar: $(ECR_REGISTRY)
      ecsClusterVar: $(ECS_CLUSTER)
      ecsServiceVar: $(ECS_SERVICE_API)
      ecsTaskFamilyVar: $(ECS_TASK_DEFINITION_FAMILY_API)
      ecsContainerVar: $(ECS_CONTAINER_API)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      runMigration: true
      migrationCommand: "cd apps/api && node_modules/.bin/prisma migrate deploy && node dist/prisma/seed.js"
      variableGroups:
        - Veracis-Registry
        - Veracis-Deploy-Production
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [ApproveDetectArtifacts]
      condition: eq(stageDependencies.ApproveDetectArtifacts.outputs['DetectArtifactsJob.DetectArtifactsStep.HAS_API'], 'true')

  - template: templates/build-rejected.yml
    parameters:
      stageName: BuildRejectedApi
      stageDisplayName: "🚫 Build Rejected API"
      app: api
      gitTag: $(GIT_TAG)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      ecrRegistryVar: $(ECR_REGISTRY)
      ecrRepositoryVar: $(ECR_API_REPOSITORY)
      variableGroups:
        - Veracis-Registry
      dependsOn: [RejectDetectArtifacts]
      condition: eq(stageDependencies.RejectDetectArtifacts.outputs['DetectArtifactsJob.DetectArtifactsStep.HAS_API'], 'true')

  - template: templates/deploy-ecs.yml
    parameters:
      stageName: DeployWeb
      stageDisplayName: "🚀 Deploy Web"
      deploymentName: DeployToWeb
      deploymentDisplayName: "Deploy veracis-web in ECS Production"
      environmentName: running
      app: web
      metadataArtifactName: build-metadata-web
      ecrRegistryVar: $(ECR_REGISTRY)
      ecrRepositoryVar: $(ECR_WEB_REPOSITORY)
      ecsClusterVar: $(ECS_CLUSTER)
      ecsServiceVar: $(ECS_SERVICE_WEB)
      ecsTaskFamilyVar: $(ECS_TASK_DEFINITION_FAMILY_WEB)
      ecsContainerVar: $(ECS_CONTAINER_WEB)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      runMigration: false
      variableGroups:
        - Veracis-Registry
        - Veracis-Deploy-Production
      artifactSource: specific
      ciResourceName: buildPipeline
      dependsOn: [ApproveDetectArtifacts]
      condition: eq(stageDependencies.ApproveDetectArtifacts.outputs['DetectArtifactsJob.DetectArtifactsStep.HAS_WEB'], 'true')

  - template: templates/build-rejected.yml
    parameters:
      stageName: BuildRejectedWeb
      stageDisplayName: "🚫 Build Rejected Web"
      app: web
      gitTag: $(GIT_TAG)
      awsCredentials: $(AWS_SERVICE_CONNECTION)
      awsRegionVar: $(AWS_REGION)
      ecrRegistryVar: $(ECR_REGISTRY)
      ecrRepositoryVar: $(ECR_WEB_REPOSITORY)
      variableGroups:
        - Veracis-Registry
      dependsOn: [RejectDetectArtifacts]
      condition: eq(stageDependencies.RejectDetectArtifacts.outputs['DetectArtifactsJob.DetectArtifactsStep.HAS_WEB'], 'true')

  - template: templates/approved-tag.yml
    parameters:
      sourceTag: $(GIT_TAG)
      changedApps: $[ stageDependencies.ApproveDetectArtifacts.DetectArtifactsJob.outputs['DetectArtifactsStep.CHANGED_APPS'] ]
      variableGroups:
        - Veracis-DevOps-Config
      dependsOn:
        - DeployApi
        - DeployWeb
        - ApproveDetectArtifacts
      condition: >
        and(
          eq(dependencies.ApproveDetectArtifacts.result, 'Succeeded'),
          in(dependencies.DeployApi.result, 'Succeeded', 'Skipped'),
          in(dependencies.DeployWeb.result, 'Succeeded', 'Skipped')
        )

  - template: templates/rejected-tag.yml
    parameters:
      sourceTag: $(GIT_TAG)
      changedApps: $[ stageDependencies.RejectDetectArtifacts.DetectArtifactsJob.outputs['DetectArtifactsStep.CHANGED_APPS'] ]
      variableGroups:
        - Veracis-DevOps-Config
      dependsOn:
        - BuildRejectedApi
        - BuildRejectedWeb
        - RejectDetectArtifacts
      condition: >
        and(
          eq(dependencies.RejectDetectArtifacts.result, 'Succeeded'),
          in(dependencies.BuildRejectedApi.result, 'Succeeded', 'Skipped'),
          in(dependencies.BuildRejectedWeb.result, 'Succeeded', 'Skipped')
        )

  - template: templates/notify.yml
    parameters:
      stageName: NotifyProductionSuccess
      stageDisplayName: "🔔 Notify Production Success"
      status: prod-success
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_ALL)
      changedApps: $[ stageDependencies.ApproveDetectArtifacts.DetectArtifactsJob.outputs['DetectArtifactsStep.CHANGED_APPS'] ]
      environmentName: Production
      gitTag: $[ stageDependencies.ApprovedTag.ApprovedTagJob.outputs['ApprovedTagStep.RELEASE_TAG'] ]
      dependsOn:
        - ApprovedTag
        - ApproveDetectArtifacts
      condition: >
        and(
          eq(dependencies.ApprovedTag.result, 'Succeeded'),
          eq(dependencies.ApproveDetectArtifacts.result, 'Succeeded')
        )

  - template: templates/notify.yml
    parameters:
      stageName: NotifyProductionRejected
      stageDisplayName: "🔔 Notify Production Rejected"
      status: rejected-tag
      webhookUrl: $(TEAMS_WEBHOOK_URL)
      mentions: $(TEAMS_MENTIONS_ALL)
      changedApps: $[ stageDependencies.RejectDetectArtifacts.DetectArtifactsJob.outputs['DetectArtifactsStep.CHANGED_APPS'] ]
      environmentName: Production
      gitTag: $[ stageDependencies.RejectedTag.RejectedTagJob.outputs['RejectedTagStep.REJECTED_TAG'] ]
      dependsOn:
        - RejectedTag
        - RejectDetectArtifacts
      condition: >
        and(
          eq(dependencies.RejectDetectArtifacts.result, 'Succeeded'),
          eq(dependencies.RejectedTag.result, 'Succeeded')
        )
