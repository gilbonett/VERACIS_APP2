services:
  postgres:
    container_name: veracis-database
    image: postgis/postgis
    platform: linux/amd64
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  redis:
    container_name: veracis-redis
    image: redis
    command: ["redis-server", "--requirepass", "admin"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  redis-cache-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-cache-commander
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:redis:6379:0:admin
    ports:
      - "8084:8081"
    depends_on:
      - redis

  redis-queue-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-queue-commander
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:redis:6379:1:admin
    ports:
      - "8083:8081"
    depends_on:
      - redis
  minio:
    image: minio/minio:latest
    container_name: veracis-minio
    ports:
      - "9000:9000" # Console/REST API
      - "9001:9001" # Web interface
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
  mailpit:
    image: axllent/mailpit:latest
    container_name: veracis-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

