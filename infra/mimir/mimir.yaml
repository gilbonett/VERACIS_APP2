multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

common:
  storage:
    backend: s3
    s3:
      bucket_name: ${MIMIR_S3_BUCKET}
      region: ${AWS_REGION}
      endpoint: s3.${AWS_REGION}.amazonaws.com

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 1

limits:
  out_of_order_time_window: 30m
  # Sem limit antes = bug de cardinalidade na app (label com userId/
  # traceId como valor) derruba o Mimir sem barreira nenhuma. Valores
  # conservadores pra uma API — ajuste se o volume real de métricas
  # for maior.
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 1000000
  # 90 dias — ajuste conforme sua política de retenção/custo de S3.
  compactor_blocks_retention_period: 2160h

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /tmp/mimir/tsdb
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync

ruler_storage:
  storage_prefix: ruler

alertmanager_storage:
  storage_prefix: alertmanager

compactor:
  data_dir: /tmp/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

store_gateway:
  sharding_ring:
    replication_factor: 1
